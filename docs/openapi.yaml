              schema:
                type: object
                properties:
                  share: { $ref: "#/components/schemas/Share" }
                  url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "PUBLIC_SHARES_ENABLED off (reason feature_disabled) or PASSWORD_CHANGE_REQUIRED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "ALREADY_EXISTS: slug taken", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      tags: [shares]
      summary: List the caller's shares, newest first (cursor; filters mode/status)
      operationId: sharesList
