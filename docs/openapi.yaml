openapi: 3.1.0
info:
  title: FileManager API
  version: 0.1.0
  description: |
    REST API aplikasi File Manager multi-user `file.kppbwi.app` (SPEC §6).
    Kerangka ini dibuat di Step 1 dan diperluas setiap step. Base path API: `/api/v1`.
    Semua error memakai envelope `{"error":{"code","message","details"}}`.
servers:
  - url: https://file.kppbwi.app
    description: Produksi (di belakang Nginx aaPanel)
  - url: http://127.0.0.1:8080
    description: Lokal (binary langsung)

tags:
  - name: system
    description: Kesehatan proses dan informasi build
  - name: auth
    description: Login, sesi, CSRF, ganti password (SPEC §8.1)
  - name: me
    description: Profil dan preferensi user (SPEC §8.18)
  - name: trash
    description: Recycle Bin per user (SPEC §8.6)
  - name: meta
    description: Favorit, pin, catatan, tag warna (SPEC §8.7)
  - name: tasks
    description: Task engine, SSE, notifikasi in-app (SPEC §7, §6.4, §8.16)
  - name: upload
    description: Upload resumable tus + precheck (SPEC §6.5, §8.8, ADR-03)
  - name: remote
    description: Remote download dari URL http/https dengan SSRF guard (SPEC §8.10, §10.1)
  - name: archives
    description: Compress & extract sebagai task, proteksi zip-slip/bomb (SPEC §8.11, ADR-08)
  - name: search
    description: Pencarian nama (walk) dan isi (ripgrep / fallback Go), replace in files dengan pratinjau, riwayat (SPEC §8.12)
  - name: versions
    description: Versi pre-image file (SPEC §8.13; Step 15 minimal — content/download tiba di Step 16b)
  - name: shares
    description: Link publik milik user (SPEC §8.15, §6.3 Shares; Step 18a)
  - name: public
    description: API tamu di balik /s/<token> — tanpa sesi, otorisasi = token/slug + cookie unlock (SPEC §6.6)

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness
      description: Selalu 200 selama proses hidup. Boleh dipublikasikan lewat Nginx (rate limit 60/menit per IP).
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
  /readyz:
    get:
      tags: [system]
      summary: Readiness
      description: Memeriksa DATA_DIR writable, STORAGE_ROOT readable (DB ditambah Step 2). Hanya loopback (tidak di-proxy Nginx).
      operationId: readyz
      responses:
        "200":
          description: Siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/version:
    get:
      tags: [system]
      summary: Versi aplikasi dan nama aplikasi
      operationId: version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, appName]
                properties:
                  version:
                    type: string
                  appName:
                    type: string

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login dengan username dan password
      description: |
        Rate limit 20 request/menit per IP (`429 RATE_LIMITED`). Lima kegagalan dalam 15 menit mengunci akun
        secara bertahap 1/5/15/60 menit (`423 ACCOUNT_LOCKED`). Kegagalan selalu dijawab `401 UNAUTHENTICATED`
        dengan pesan generik. Sukses mengirim cookie `fm_session` (HttpOnly, Secure, SameSite=Lax) dan token CSRF.
        Request lintas situs (`Sec-Fetch-Site: cross-site` atau `Origin` asing) ditolak `403 CSRF_INVALID`.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024, format: password }
                totp: { type: string, description: "Kode TOTP 6 digit (fase akhir, Step 23a)" }
      responses:
        "200":
          description: Login berhasil
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "fm_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=<SESSION_ABSOLUTE_TIMEOUT>"
          content:
            application/json:
              schema:
                type: object
                required: [user, mustChangePassword, csrfToken]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  mustChangePassword: { type: boolean }
                  csrfToken: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: "UNAUTHENTICATED — username atau password salah", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "ACCOUNT_DISABLED atau CSRF_INVALID", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423":
          description: ACCOUNT_LOCKED — `details.retryAfter` detik
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: RATE_LIMITED
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout (mencabut sesi saat ini)
      operationId: authLogout
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        "204": { description: Sesi dicabut, cookie dihapus }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/csrf:
    get:
      tags: [auth]
      summary: Token CSRF untuk sesi ini
      operationId: authCsrf
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: User saat ini, preferensi ringkas, dan konfigurasi client
      description: Tetap dapat diakses saat `mustChangePassword` (endpoint lain menjawab `403 PASSWORD_CHANGE_REQUIRED`).
      operationId: authMe
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user, config]
                properties:
                  user:
                    allOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        properties:
                          quota:
                            type: object
                            properties:
                              limit: { type: integer, format: int64 }
                              used: { type: integer, format: int64, description: "0 sampai Step 10a" }
                              trash: { type: integer, format: int64 }
                              versions: { type: integer, format: int64 }
                          language: { type: string, enum: [id, en] }
                          prefs: { type: object, additionalProperties: true }
                  config: { $ref: "#/components/schemas/ClientConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: ACCOUNT_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Ganti password (wajib saat login pertama)
      description: |
        Kebijakan SPEC §10.4: minimal `PASSWORD_MIN_LENGTH` (12), maksimal 128 karakter, bukan password umum,
        tidak mengandung username, tidak sama dengan password sekarang maupun password awal. Sukses mencabut
        semua sesi lain dan menghapus `mustChangePassword`. Rate limit 5 percobaan terverifikasi / 15 menit per sesi.
      operationId: authChangePassword
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password diganti }
        "400":
          description: "VALIDATION_FAILED — `details.fields.newPassword` ∈ too_short|too_long|common|contains_username|same_as_current|same_as_initial|invalid_encoding, atau `details.fields.currentPassword: incorrect`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: CSRF_INVALID, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429":
          description: RATE_LIMITED
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/me/preferences:
    get:
      tags: [me]
      summary: Preferensi user (dokumen JSON)
      operationId: mePreferencesGet
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: PASSWORD_CHANGE_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [me]
      summary: Merge-patch preferensi (`null` menghapus key)
      operationId: mePreferencesPut
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Preferensi setelah patch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { description: "PAYLOAD_TOO_LARGE — dokumen > 64 KB", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/me/editor-session:
    get:
      tags: [me]
      summary: Open editor tabs of the user (SPEC §8.13 "Tab & sesi")
      operationId: meEditorSessionGet
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: "`{tabs:[], activePath:null}` when nothing was saved yet"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: PASSWORD_CHANGE_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [me]
      summary: Replace the open tabs (max 20; paths validated; ≤ 32 KB)
      operationId: meEditorSessionPut
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorSession" }
      responses:
        "200":
          description: Stored session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /api/v1/me/media-position:
    get:
      tags: [me]
      summary: Last playback position of a video (SPEC §8.14 VideoPlayer resume; Step 17b)
      operationId: meMediaPositionGet
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: "`seconds: 0` and `updatedAt: null` when nothing is stored"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPosition" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: PASSWORD_CHANGE_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [me]
      summary: Store a playback position (max 500 per user, least recently updated pruned; seconds 0 forgets)
      operationId: meMediaPositionPut
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, seconds]
              properties:
                path: { type: string }
                seconds: { type: number, minimum: 0, maximum: 10000000 }
                duration: { type: number, minimum: 0 }
      responses:
        "200":
          description: Stored position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPosition" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/me/folder-prefs:
    get:
      tags: [me]
      summary: Preferensi tampilan satu folder (view, sort, kolom)
      operationId: meFolderPrefGet
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Path virtual folder }
      responses:
        "200":
          description: "`pref` null jika belum ada"
          content:
            application/json:
              schema:
                type: object
                required: [pref]
                properties:
                  pref: { oneOf: [{ $ref: "#/components/schemas/FolderViewPref" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "NOT_FOUND — path reserved (.system)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [me]
      summary: Simpan preferensi tampilan satu folder (maks 500 folder per user, LRU)
      operationId: meFolderPrefPut
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                view: { type: string, enum: [details, list, tiles, large, xlarge], default: details }
                sort: { type: string, enum: [name, size, type, ext, mtime, btime, atime, mode, note, dimensions, duration], default: name }
                dir: { type: string, enum: [asc, desc], default: asc }
                sort2: { type: string }
                dir2: { type: string, enum: [asc, desc] }
                columns: { $ref: "#/components/schemas/ColumnsPref" }
      responses:
        "200":
          description: Preferensi tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [pref]
                properties:
                  pref: { $ref: "#/components/schemas/FolderViewPref" }
        "400": { description: "VALIDATION_FAILED — details.fields.{view,sort,dir,sort2,dir2,columns}", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      summary: Hapus preferensi tampilan satu folder
      operationId: meFolderPrefDelete
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Dihapus (idempoten) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/files/list:
    get:
      summary: List a folder (sorted in the server, cursor paging)
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Virtual folder path ("/" = user root) }
        - { name: sort, in: query, schema: { type: string, enum: [name, size, type, ext, mtime, btime, atime, mode, note, dimensions, duration], default: name } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: sort2, in: query, schema: { type: string } }
        - { name: dir2, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from nextCursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 }, description: Default LISTING_PAGE_SIZE }
        - { name: foldersFirst, in: query, schema: { type: boolean, default: true } }
        - { name: hidden, in: query, schema: { type: boolean, default: true }, description: Include dotfiles }
        - { name: filter, in: query, schema: { type: string, maxLength: 255 }, description: Case-insensitive substring on the whole folder }
        - { name: types, in: query, schema: { type: string }, description: Comma-separated categories (folder,image,video,audio,archive,code,document,spreadsheet,presentation,pdf,text,font,other) }
        - { name: counts, in: query, schema: { type: boolean, default: false }, description: Fill itemCount for folders on the page (max 2000 per request) }
        - { name: tag, in: query, schema: { type: string, enum: [red, orange, yellow, green, blue, purple, gray] }, description: Only items carrying this colour tag (Step 10b) }
        - { name: media, in: query, schema: { type: boolean, default: false }, description: Probe up to 50 media files of the page synchronously (Dimensi/Durasi columns); the rest is queued }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/content:
    get:
      tags: [files]
      summary: Open a text file for the editor (SPEC §8.13 "Membuka file")
      operationId: filesContentGet
      description: |
        Regular files only (`400 VALIDATION_FAILED reason=not_a_file` for folders). Binary content (NUL in the first 8000 bytes or > 30 %
        non-text bytes) answers `415 BINARY_FILE`. Files above `EDITOR_MAX_FILE_SIZE` answer `413 FILE_TOO_LARGE` unless `tail` is given:
        `tail=N` (or `tail=true` → 1000) returns the last N lines (≤ 2 MB, from a line boundary) read-only with `truncated:true`,
        `offset` (byte offset of the first returned line) and `tailLines`; ask for a bigger N to load more. Encoding: BOM (UTF-8/UTF-16)
        → certain; valid UTF-8 → `utf-8`; otherwise chardet (gbk, big5, shift_jis, euc-jp, euc-kr, windows-125x, iso-8859-x, koi8-r)
        with ≥ 50 % confidence, fallback `windows-1252`; `encoding=` overrides. Undecodable bytes become U+FFFD and set `lossy:true`.
        `eol` is `lf`, `crlf` or `mixed`. `etag` (`"size-mtimeNs"`) must be sent back as `If-Match` on save. Takes a read lock.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: encoding, in: query, schema: { type: string }, description: "Override the detected encoding" }
        - { name: tail, in: query, schema: { type: string }, description: "Line count or true (1000) for tail mode (alias tail_lines)" }
      responses:
        "200":
          description: Decoded content
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { description: FILE_TOO_LARGE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: BINARY_FILE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { $ref: "#/components/responses/Error" }
    put:
      tags: [files]
      summary: Save a text file (SPEC §8.13 "Menyimpan")
      operationId: filesContentPut
      description: |
        Header `If-Match: <etag>` (from GET; `*` or `force:true` skips the check). A different server etag answers `409 CONFLICT`
        (`details.serverEtag`, `serverMtime`, `serverSize`). The text is encoded to `encoding` (default utf-8; `bom:true` adds a BOM,
        UTF-16 always has one) — an unrepresentable character answers `400 VALIDATION_FAILED fields.content=unencodable` with
        `details.line/col/char`; `eol` `lf|crlf` rewrites every line ending, `keep` (default) leaves them. Bytes identical to the file
        → `200 noop:true` without a write or a version. Otherwise: write lock, pre-image version (`reason save|force_save`, deduplicated
        by sha256, when versions are enabled), atomic write (tmp + rename, mode kept), quota delta, activity `edit`. A missing file is
        created only with `create:true` (blocked extensions refused, folder must exist, activity `create`). Body limit:
        4 × `EDITOR_MAX_FILE_SIZE` + 64 KB (JSON escaping); `content` itself ≤ `EDITOR_MAX_FILE_SIZE`.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileContentPut" }
      responses:
        "200":
          description: Saved (or no-op)
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContentSaved" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: CONFLICT (etag mismatch), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: FILE_TOO_LARGE or QUOTA_EXCEEDED or PAYLOAD_TOO_LARGE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /api/v1/files/stat:
    get:
      summary: Describe one item
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Item plus stat details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/media-info:
    get:
      summary: Media metadata and EXIF of one file (viewer info panel)
      description: |
        The cached `media_metadata` row of a file (dimensions, duration, codecs, audio tags, thumbnail state)
        plus the EXIF subset of raster images (camera, lens, exposure, dates, orientation; SPEC §8.14).
        The GPS position is stored but only returned with `include_gps=1`; `exif.hasGps` says whether it exists.
        Files outside the media categories answer `kind: other` with the extension MIME only.
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: include_gps, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Media metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/subtitle:
    get:
      summary: Sidecar subtitle as sanitised WebVTT (signed URL; Step 17b)
      description: |
        Serves a `.srt`/`.vtt` file of the signing user as `text/vtt; charset=utf-8` (≤ 2 MiB). SubRip is
        converted, WebVTT re-emitted; only cue timing, well-formed cue settings and the tags `<b> <i> <u>`
        survive (other markup, STYLE/REGION/NOTE blocks dropped; stray `< > &` escaped). The text encoding is
        detected like the editor's. URLs come from `GET /files/media-info` (`subtitles[].url`, purpose `media`,
        TTL `MEDIA_URL_TTL`); no cookie is needed.
      tags: [files]
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [media] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: WebVTT document
          content:
            text/vtt: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/templates:
    get:
      summary: List the templates accepted by POST /files/create
      tags: [files]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Template identifiers (= file extension)
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { type: string, example: md }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/files/mkdir:
    post:
      summary: Create a folder
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MkdirRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/create:
    post:
      summary: Create an empty file or one from a template
      description: Inline `content` (or the template body) is reserved against the user's quota before the file is written; over quota answers `413 QUOTA_EXCEEDED` (SPEC §8.2).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/rename:
    post:
      summary: Rename a file or folder (undoable)
      description: Metadata references (favorites, pins, notes, tags, versions) follow the item in one transaction (SPEC §5.7). The response carries a one-time `undoToken` valid for 60 s (SPEC §8.5).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/files/copy:
    post:
      summary: Copy items into a folder
      description: |
        Synchronous up to 2000 entries / 200 MB (`413 PAYLOAD_TOO_LARGE` with `details.reason=task_required` beyond that until the
        task engine of Step 11). Without `onConflict` an occupied destination answers `409 ALREADY_EXISTS` with
        `details.existing`, `details.incoming` and `details.conflicts[]`. Folder onto folder merges with the policy applied per file.
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "202":
          description: Beyond the synchronous limits (> 2.000 entries / 200 MB, or a cross-filesystem move) the operation runs as a task (Step 11); `results` is empty and `undo` null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/move:
    post:
      summary: Move items into a folder (undoable)
      description: Same request and conflict handling as copy. Moving a folder into itself or a descendant answers `400 VALIDATION_FAILED` (`details.reason=cannot_move_into_self`).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "202":
          description: Beyond the synchronous limits (> 2.000 entries / 200 MB, or a cross-filesystem move) the operation runs as a task (Step 11); `results` is empty and `undo` null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/duplicate:
    post:
      summary: Duplicate an item next to itself as "name (n).ext"
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/symlink:
    post:
      summary: Create a symbolic link (relative target inside the root)
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SymlinkRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/chmod:
    post:
      summary: Change permission bits (rwx only; setuid/setgid/sticky are dropped)
      description: "Recursive requests are bounded by the synchronous entry limit (`413` beyond it). Not undoable (`undo` is null)."
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChmodRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/delete:
    post:
      summary: Move items to the Recycle Bin (undoable)
      description: Each item becomes a `trash_items` row and is renamed into `DATA_DIR/trash/<user>/<id>`; one request = one `batchId`. Metadata rows stay so a restore brings favorites/notes/tags back (SPEC §8.5, §8.6).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathsRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/batch-rename/preview:
    post:
      summary: Preview a batch rename rule
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRenameRequest" }
      responses:
        "200":
          description: Preview rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchRenamePreviewResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/batch-rename:
    post:
      summary: Apply a batch rename rule (undoable)
      description: The server recomputes the preview; any collision or invalid name (including a file name ending in a blocked extension, reason `blocked_extension`) answers `409 CONFLICT` with `details.items`. Renames run in two phases through temporary names and roll back on failure.
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRenameRequest" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/undo:
    post:
      summary: Undo the operation identified by a one-time token
      description: Tokens live 60 s in memory and belong to the user who received them (`404` otherwise). A changed state answers `409 CONFLICT` (`details.reason=undo_conflict`).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UndoRequest" }
      responses:
        "200":
          description: Undone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/me/quota:
    get:
      tags: [me]
      summary: Kuota penyimpanan user (limit, terpakai, trash, versi)
      operationId: meQuota
      description: "`used` = berkas di root user, `trash` dan `versions` ikut dihitung terhadap `quota` (SPEC §8.2, ADR-23). `dirty` true berarti angka belum pernah direkalkulasi atau ada operasi yang sebagian gagal; job 03:30 memperbaikinya."
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaUsage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/files/delete-permanent:
    post:
      summary: Delete items for good (Shift+Delete), bypassing the Recycle Bin
      description: RemoveAll + every metadata reference and version row; quota decreases; audit `file.delete_permanent`. More than 50 items require `confirm:"HAPUS"`. Not undoable (SPEC §8.5 "Hapus permanen").
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletePermanentRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermanentResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/dir-size:
    post:
      summary: Folder size (files, dirs, bytes) with a 60 s walk budget
      description: Synchronous until Step 11 turns long walks into a task; `partial` is true when the budget ran out. Results are cached 10 minutes per path and reused by the Ukuran column and Properties (SPEC §8.7).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirSizeResponse" }
        "202":
          description: The 60 s walk budget ran out; the partial numbers are returned with `task` (type `dir_size`) that finishes the walk (Step 11). `file.changed` is emitted when it completes.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/DirSizeResponse" }
                  - { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/checksum:
    post:
      summary: MD5 / SHA-1 / SHA-256 of a file (≤ 100 MB synchronously)
      description: Larger files are hashed by a `checksum` task (`202 {task}`, Step 11); once cached the digest is served synchronously. Digests are cached 10 minutes per size+mtime and also appear as `checksums` in `GET /files/stat` (SPEC §8.7).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecksumRequest" }
      responses:
        "200":
          description: Digests (hex, lowercase)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecksumResponse" }
        "202":
          description: File above 100 MB — hashed by a task; the result object carries the digests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/checksum/verify:
    post:
      summary: Compare a file with an expected digest
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecksumVerifyRequest" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecksumVerifyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/trash:
    get:
      tags: [trash]
      summary: Recycle Bin items of the user (filter, search, sort, page)
      operationId: trashList
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [file, folder, dir, image, document, video, audio, archive, other] } }
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive substring of the name }
        - { name: sort, in: query, schema: { type: string, enum: [deleted, name, size, expires, path], default: deleted } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] }, description: "Default: deleted desc, otherwise asc" }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashListResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/trash/restore:
    post:
      tags: [trash]
      summary: Restore items to their original location or into `to`
      operationId: trashRestore
      description: Missing parent folders are recreated. An occupied destination follows `onConflict`/`perItem[id]`; with the default `fail` every conflict is listed in `409 ALREADY_EXISTS details.conflicts[]` (keyed by trash id) before anything moves. `overwrite` sends the existing item to the Recycle Bin first. `reactivateShares` is always empty until Step 18a (SPEC §8.6).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrashRestoreRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashRestoreResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: "NOT_FOUND — unknown id or another user's item", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/trash/purge:
    post:
      tags: [trash]
      summary: Delete Recycle Bin items for good
      operationId: trashPurge
      description: Unknown or foreign ids are reported with `status:"gone"`. Audit `file.delete_permanent` (SPEC §8.6).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string }, maxItems: 2000 }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashPurgeResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/trash/empty:
    post:
      tags: [trash]
      summary: Empty the Recycle Bin (requires `confirm:"HAPUS"`)
      operationId: trashEmpty
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [HAPUS] }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashPurgeResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/files/sign:
    post:
      summary: Sign content URLs (thumb, download, media, inline)
      description: |
        Returns short-lived signed URLs (SPEC §8.9, ADR-15): one `path`, a batch `paths` sharing a `purpose`, or
        `items` with a purpose each (≤ 500). TTL: `download|inline` → SIGNED_URL_TTL (5 m), `media|thumb` →
        MEDIA_URL_TTL (2 h). Zip URLs come from `POST /files/zip`. Signed endpoints need no cookie but the account
        must stay active.
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignRequest" }
      responses:
        "200":
          description: Signed URL(s)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SignResponse"
                  - $ref: "#/components/schemas/SignBatchResponse"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/files/thumb:
    get:
      summary: Serve a thumbnail (signed URL, no cookie)
      description: |
        Authenticated by the signature only (`<img>` tags, new tabs). `200 image/webp` with `ETag` and
        `Cache-Control: private, max-age=86400` (`304` on `If-None-Match`); `202` + `Retry-After: 2` while
        the thumbnail is being rendered (client retries at most 3×); `404` when the type is unsupported or
        rendering failed (client shows the type icon); `403 SIGNATURE_*`; `429` above 20 parallel requests per user.
      tags: [files]
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: size, in: query, required: true, schema: { type: integer, enum: [128, 256, 512] } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [thumb] } }
        - { name: scope, in: query, required: true, schema: { type: string }, description: "u:<user_id> (share scopes from Step 18a)" }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 }, description: Unix seconds }
        - { name: sig, in: query, required: true, schema: { type: string }, description: base64url HMAC-SHA256, 32 chars }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200":
          description: WebP thumbnail
          content:
            image/webp:
              schema: { type: string, format: binary }
        "202": { description: Rendering in progress; retry after `Retry-After` seconds }
        "304": { description: Not modified }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/files/download:
    head:
      summary: Headers of a download (same parameters as GET)
      tags: [files]
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [download] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Headers only (ETag, Accept-Ranges, Content-Disposition, Content-Length) }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      summary: Download one file (signed URL, no cookie, Range)
      description: |
        Authenticated by the signature only (`purpose=download`, SPEC §8.9, ADR-15) so download managers, new tabs and
        `<a download>` work without cookies; the account must still be active (`403` otherwise). Served with
        `http.ServeContent`: `Accept-Ranges: bytes`, strong `ETag` (inode, size, mtime), `Last-Modified`, `If-Range`,
        `206` for `Range`, `304` for `If-None-Match`, `HEAD`. Always `Content-Disposition: attachment` with
        `filename*=UTF-8''`; MIME from magic bytes, but HTML/SVG/XML/JS/CSS are always `application/octet-stream`.
        Headers: `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src 'none'`,
        `Cache-Control: private, max-age=0, must-revalidate`, `Referrer-Policy: no-referrer`, `X-Accel-Buffering: no`.
        At most 3 concurrent downloads/zips per user (`429 RATE_LIMITED`, `Retry-After: 5`, `details.reason=concurrent_downloads`).
      tags: [files]
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [download] } }
        - { name: scope, in: query, required: true, schema: { type: string }, description: "u:<user_id>" }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
        - { name: Range, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - { name: If-Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: Whole file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Partial content }
        "304": { description: Not modified }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/files/raw:
    head:
      summary: Headers of a raw stream (same parameters as GET)
      tags: [files]
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [media, inline] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
        - { name: variant, in: query, schema: { type: string, enum: [preview, thumb] } }
      responses:
        "200": { description: Headers only }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      summary: Stream a file for a viewer (signed URL, inline policy)
      description: |
        Like `/files/download` but for `purpose=media|inline` (TTL `MEDIA_URL_TTL` for media). Inline policy (ADR-06):
        only raster images, audio and video are `Content-Disposition: inline`; PDF, text and everything else are
        attachments (viewers fetch them); HTML/SVG/XML/JS/CSS are always `application/octet-stream` attachments.
        `variant=thumb` serves the 512 px thumbnail (`202` + `Retry-After` while rendering), `variant=preview`
        the 2048 px WebP of a raster/SVG image rendered on demand (falls back to the 512 px thumbnail for
        video/PDF/audio). Inline media is not counted against the download concurrency limit.
      tags: [files]
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [media, inline] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
        - { name: variant, in: query, schema: { type: string, enum: [preview, thumb] } }
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: File bytes (inline or attachment per policy)
          content:
            "*/*":
              schema: { type: string, format: binary }
        "202": { description: Thumbnail variant still rendering }
        "206": { description: Partial content }
        "304": { description: Not modified }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/zip:
    post:
      summary: Prepare a streamed zip of several items
      description: |
        Stores the path list in `DATA_DIR/tmp/zip-<id>.json` (10 minutes) and returns a signed URL
        (`purpose=zip`, TTL `SIGNED_URL_TTL`). Up to 2000 paths; the root can not be an entry.
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZipRequest" }
      responses:
        "200":
          description: Signed zip URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZipResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    head:
      summary: Headers of the zip stream (same parameters as GET)
      tags: [files]
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [zip] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Headers only (no Content-Length) }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      summary: Stream the zip (signed URL, no cookie)
      description: |
        `application/zip` written straight to the response (`archive/zip`, Store by default, Deflate level 1 on
        request, zip64 automatic, UTF-8 names, folders recursed, symlinks skipped and listed in `_ERRORS.txt`,
        items missing mid-walk skipped). No `Content-Length`, `Accept-Ranges: none`, no temp file. Read lock on the
        sources (`409 OPERATION_IN_PROGRESS` while a mutation holds them). Counts against the 3 concurrent
        downloads per user. `404` when the payload expired or belongs to another user.
      tags: [files]
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string }, description: Payload id }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [zip] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Zip stream
          content:
            application/zip:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/meta/favorites:
    get:
      summary: Every favorite of the user (folders first, natural order)
      description: Items whose path no longer exists are returned with `broken:true` / `brokenReason:"missing"` so the UI can offer "Hapus dari favorit" instead of failing (SPEC §8.7).
      tags: [meta]
      operationId: metaFavoritesList
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsResponse" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      summary: Add favorites (files or folders; existing rows kept)
      tags: [meta]
      operationId: metaFavoritesAdd
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetaPathsRequest" }
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove favorites (broken references too)
      tags: [meta]
      operationId: metaFavoritesRemove
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetaPathsRequest" }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/meta/pins:
    get:
      summary: Pinned items of one folder
      tags: [meta]
      operationId: metaPinsList
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: dir, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, dir, max]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Item" } }
                  dir: { type: string }
                  max: { type: integer, description: Pins allowed per folder (50) }
        "401": { $ref: "#/components/responses/Error" }
    put:
      summary: Pin items to the top of their parent folder (max 50 per folder)
      description: Pinned items sort first in every sort order of the listing (SPEC §8.7). Over the limit → `400 VALIDATION_FAILED` with `details.reason=pin_limit`.
      tags: [meta]
      operationId: metaPinsAdd
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetaPathsRequest" }
      responses:
        "200":
          description: Pinned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unpin items
      tags: [meta]
      operationId: metaPinsRemove
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetaPathsRequest" }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/meta/notes:
    put:
      summary: Set the plain-text note of one item (max 500 characters; empty removes it)
      tags: [meta]
      operationId: metaNoteSet
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetaNoteRequest" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [path, note, max]
                properties:
                  path: { type: string }
                  note: { type: string }
                  max: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove notes
      tags: [meta]
      operationId: metaNoteRemove
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetaPathsRequest" }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/meta/tags:
    put:
      summary: Set the colour tag of items (one colour per item)
      tags: [meta]
      operationId: metaTagsSet
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetaTagsRequest" }
      responses:
        "200":
          description: Tagged
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/MetaResult" }
                  - type: object
                    properties:
                      color: { $ref: "#/components/schemas/TagColor" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Clear the colour tag of items
      tags: [meta]
      operationId: metaTagsRemove
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetaPathsRequest" }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/meta/tagged:
    get:
      summary: Every item carrying a colour (broken references flagged)
      tags: [meta]
      operationId: metaTagged
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: color, in: query, required: true, schema: { $ref: "#/components/schemas/TagColor" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ItemsResponse" }
                  - type: object
                    properties:
                      color: { $ref: "#/components/schemas/TagColor" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/me/recent:
    get:
      summary: Recently opened / edited / uploaded / created / restored items (30 days, one row per path)
      description: Derived from `activity_logs`; only paths that still exist are returned, each with `location` (parent folder) for "Buka lokasi file" (SPEC §8.7).
      tags: [me]
      operationId: meRecent
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentResponse" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      summary: Record that the user opened an item (viewer, Quick Look, editor)
      description: Writes an `open` activity row so reads show up in Recent; the path must exist.
      tags: [me]
      operationId: meRecentRecord
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathRequest" }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me/activity:
    get:
      summary: The user's activity journal (newest first, cursor paging)
      description: Filters by action, day range (`YYYY-MM-DD`, `to` inclusive) and path substring; `exists` tells whether the item still exists (SPEC §8.16 "Aktivitas user"). Retention `ACTIVITY_RETENTION_DAYS`.
      tags: [me]
      operationId: meActivity
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: nextCursor of the previous page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: YYYY-MM-DD or RFC 3339, inclusive }
        - { name: to, in: query, schema: { type: string }, description: YYYY-MM-DD (whole day) or RFC 3339, exclusive }
        - { name: q, in: query, schema: { type: string, maxLength: 255 }, description: Case-insensitive substring of path / target }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResponse" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete the whole journal of the user ("Hapus riwayat saya"; audit rows untouched)
      tags: [me]
      operationId: meActivityClear
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer, format: int64 }
  /api/v1/me/storage-analysis:
    get:
      summary: Storage analysis of the user root (treemap depth 3, 50 largest files, totals per type)
      description: One walk with a 60 s budget (`partial:true` when cut, Step 11 turns it into a task), cached 10 minutes per user and dropped by any file mutation. Sizes follow quota accounting (regular files + symlink sizes) so `total` equals `quota.used`.
      tags: [me]
      operationId: meStorageAnalysis
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK (cached or freshly computed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageAnalysis" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Recompute the storage analysis now ("Hitung ulang")
      tags: [me]
      operationId: meStorageAnalysisRecompute
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Recomputed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageAnalysis" }
        "202":
          description: Walk cut by the 60 s budget — the partial report plus `task` (type `dir_size`, `payload.analysis=true`) that completes it (Step 11).
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/StorageAnalysis" }
                  - { $ref: "#/components/schemas/TaskAccepted" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: The user's tasks, newest first
      operationId: tasksList
      description: Hidden tasks (thumbnail batches) are omitted. Cursor = `nextCursor` of the previous page (SPEC §7).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [queued, running, done, failed, cancelled, interrupted] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskListResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{id}:
    get:
      tags: [tasks]
      summary: One task (404 for another user's id)
      operationId: tasksGet
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [tasks]
      summary: Remove a finished task from the list
      operationId: tasksDelete
      description: Only `done|failed|cancelled|interrupted` tasks; a live one answers `409 CONFLICT details.reason=task_final`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{id}/logs:
    get:
      tags: [tasks]
      summary: Task log lines (≤ 500 per call, after a log id)
      operationId: tasksLogs
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TaskLogEntry" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: Cancel a queued or running task
      operationId: tasksCancel
      description: A queued task is cancelled at once; a running one when its runner observes the context and removed its partial results. Finished tasks answer `409 task_final`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancellation requested (or done)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{id}/retry:
    post:
      tags: [tasks]
      summary: Retry a failed, cancelled or interrupted task as a new task
      operationId: tasksRetry
      description: The new task copies type, title and payload (`retryOf` = old id). Tasks that needed a password answer `409 needs_secret` (the UI asks again).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "202":
          description: New task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/events:
    get:
      tags: [tasks]
      summary: Server-Sent Events stream (SPEC §6.4)
      operationId: events
      description: |
        `text/event-stream` with `retry: 3000`, `id: <unix_ms>-<seq>`, a `: ping` comment every 25 s and `X-Accel-Buffering: no`.
        `Last-Event-ID` (header or `lastEventId` query) replays the events still in the per-user ring (200); an unknown id yields a `resync` event (refetch tasks and notifications).
        Events: `task.created|progress|done|failed|cancelled` (data: Task), `notification` (data: Notification), `file.changed` (`{dir, reason, paths?}`), `quota.updated` (`{used, trash, versions, limit, free, percent}`), `resync` (`{}`).
        At most 5 connections per user (the oldest is closed). Excluded from the API timeout.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: lastEventId, in: query, schema: { type: string } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/notifications:
    get:
      tags: [tasks]
      summary: In-app notifications, newest first (SPEC §8.16)
      operationId: notificationsList
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationListResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/read:
    post:
      tags: [tasks]
