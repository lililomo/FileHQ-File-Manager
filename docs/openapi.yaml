      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [read, unread]
                properties:
                  read: { type: integer, description: Rows changed }
                  unread: { type: integer, description: Remaining unread }
        "400": { $ref: "#/components/responses/Error" }
