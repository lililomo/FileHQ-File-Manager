          items:
            type: object
            required: [path, status, replacements]
            properties:
              path: { type: string }
              status: { type: string, enum: [ok, skipped] }
              reason: { type: string, enum: [locked, changed, no_change, version_failed, quota, write_failed, encoding, too_large, binary, unreadable] }
              replacements: { type: integer }
              versionId: { type: string }
        replacements: { type: integer }
        versionIds: { type: array, items: { type: string } }
        skipped: { type: integer }
    SearchHistoryEntry:
      type: object
      required: [id, kind, query, path, at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [name, content] }
        query: { type: string }
        path: { type: string }
        filters: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    FileVersion:
      type: object
      required: [id, path, no, size, sha256, reason, createdAt]
      properties:
        id: { type: string }
        path: { type: string }
        no: { type: integer }
        size: { type: integer }
        sha256: { type: string }
        reason: { type: string, enum: [save, force_save, restore, replace_in_files, external_overwrite] }
        createdAt: { type: string, format: date-time }
    VersionRestoreResult:
      type: object
      required: [path, size, etag, restored]
      properties:
        path: { type: string }
        size: { type: integer }
        etag: { type: string }
        version: { oneOf: [{ $ref: "#/components/schemas/FileVersion" }, { type: "null" }], description: "Pre-image of the replaced content" }
        restored: { $ref: "#/components/schemas/FileVersion" }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
