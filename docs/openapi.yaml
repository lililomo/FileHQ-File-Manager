        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: YYYY-MM-DD or RFC 3339, inclusive }
        - { name: to, in: query, schema: { type: string }, description: YYYY-MM-DD (whole day) or RFC 3339, exclusive }
