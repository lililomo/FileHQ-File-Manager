openapi: 3.1.0
info:
  title: FileManager API
  version: 0.1.0
  description: |
    REST API aplikasi File Manager multi-user `file.kppbwi.app` (SPEC §6).
    Kerangka ini dibuat di Step 1 dan diperluas setiap step. Base path API: `/api/v1`.
    Semua error memakai envelope `{"error":{"code","message","details"}}`.
servers:
  - url: https://file.kppbwi.app
    description: Produksi (di belakang Nginx aaPanel)
  - url: http://127.0.0.1:8080
    description: Lokal (binary langsung)

tags:
  - name: system
    description: Kesehatan proses dan informasi build
  - name: auth
    description: Login, sesi, CSRF, ganti password (SPEC §8.1)
  - name: me
    description: Profil dan preferensi user (SPEC §8.18)

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness
      description: Selalu 200 selama proses hidup. Boleh dipublikasikan lewat Nginx (rate limit 60/menit per IP).
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
  /readyz:
    get:
      tags: [system]
      summary: Readiness
      description: Memeriksa DATA_DIR writable, STORAGE_ROOT readable (DB ditambah Step 2). Hanya loopback (tidak di-proxy Nginx).
      operationId: readyz
      responses:
        "200":
          description: Siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/version:
    get:
      tags: [system]
      summary: Versi aplikasi dan nama aplikasi
      operationId: version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, appName]
                properties:
                  version:
                    type: string
                  appName:
                    type: string

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login dengan username dan password
      description: |
        Rate limit 20 request/menit per IP (`429 RATE_LIMITED`). Lima kegagalan dalam 15 menit mengunci akun
        secara bertahap 1/5/15/60 menit (`423 ACCOUNT_LOCKED`). Kegagalan selalu dijawab `401 UNAUTHENTICATED`
        dengan pesan generik. Sukses mengirim cookie `fm_session` (HttpOnly, Secure, SameSite=Lax) dan token CSRF.
        Request lintas situs (`Sec-Fetch-Site: cross-site` atau `Origin` asing) ditolak `403 CSRF_INVALID`.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024, format: password }
                totp: { type: string, description: "Kode TOTP 6 digit (fase akhir, Step 23a)" }
      responses:
        "200":
          description: Login berhasil
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "fm_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=<SESSION_ABSOLUTE_TIMEOUT>"
          content:
            application/json:
              schema:
                type: object
                required: [user, mustChangePassword, csrfToken]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  mustChangePassword: { type: boolean }
                  csrfToken: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: "UNAUTHENTICATED — username atau password salah", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "ACCOUNT_DISABLED atau CSRF_INVALID", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423":
          description: ACCOUNT_LOCKED — `details.retryAfter` detik
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: RATE_LIMITED
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout (mencabut sesi saat ini)
      operationId: authLogout
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        "204": { description: Sesi dicabut, cookie dihapus }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/csrf:
    get:
      tags: [auth]
      summary: Token CSRF untuk sesi ini
      operationId: authCsrf
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: User saat ini, preferensi ringkas, dan konfigurasi client
      description: Tetap dapat diakses saat `mustChangePassword` (endpoint lain menjawab `403 PASSWORD_CHANGE_REQUIRED`).
      operationId: authMe
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user, config]
                properties:
                  user:
                    allOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        properties:
                          quota:
                            type: object
                            properties:
                              limit: { type: integer, format: int64 }
                              used: { type: integer, format: int64, description: "0 sampai Step 10a" }
                              trash: { type: integer, format: int64 }
                              versions: { type: integer, format: int64 }
                          language: { type: string, enum: [id, en] }
                          prefs: { type: object, additionalProperties: true }
                  config: { $ref: "#/components/schemas/ClientConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: ACCOUNT_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Ganti password (wajib saat login pertama)
      description: |
        Kebijakan SPEC §10.4: minimal `PASSWORD_MIN_LENGTH` (12), maksimal 128 karakter, bukan password umum,
        tidak mengandung username, tidak sama dengan password sekarang maupun password awal. Sukses mencabut
        semua sesi lain dan menghapus `mustChangePassword`. Rate limit 5 percobaan terverifikasi / 15 menit per sesi.
      operationId: authChangePassword
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password diganti }
        "400":
          description: "VALIDATION_FAILED — `details.fields.newPassword` ∈ too_short|too_long|common|contains_username|same_as_current|same_as_initial|invalid_encoding, atau `details.fields.currentPassword: incorrect`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: CSRF_INVALID, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429":
          description: RATE_LIMITED
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/me/preferences:
    get:
      tags: [me]
      summary: Preferensi user (dokumen JSON)
      operationId: mePreferencesGet
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: PASSWORD_CHANGE_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [me]
      summary: Merge-patch preferensi (`null` menghapus key)
      operationId: mePreferencesPut
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Preferensi setelah patch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { description: "PAYLOAD_TOO_LARGE — dokumen > 64 KB", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/me/folder-prefs:
    get:
      tags: [me]
      summary: Preferensi tampilan satu folder (view, sort, kolom)
      operationId: meFolderPrefGet
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Path virtual folder }
      responses:
        "200":
          description: "`pref` null jika belum ada"
          content:
            application/json:
              schema:
                type: object
                required: [pref]
                properties:
                  pref: { oneOf: [{ $ref: "#/components/schemas/FolderViewPref" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "NOT_FOUND — path reserved (.system)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [me]
      summary: Simpan preferensi tampilan satu folder (maks 500 folder per user, LRU)
      operationId: meFolderPrefPut
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                view: { type: string, enum: [details, list, tiles, large, xlarge], default: details }
                sort: { type: string, enum: [name, size, type, ext, mtime, btime, atime, mode, note, dimensions, duration], default: name }
                dir: { type: string, enum: [asc, desc], default: asc }
                sort2: { type: string }
                dir2: { type: string, enum: [asc, desc] }
                columns: { $ref: "#/components/schemas/ColumnsPref" }
      responses:
        "200":
          description: Preferensi tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [pref]
                properties:
                  pref: { $ref: "#/components/schemas/FolderViewPref" }
        "400": { description: "VALIDATION_FAILED — details.fields.{view,sort,dir,sort2,dir2,columns}", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      summary: Hapus preferensi tampilan satu folder
      operationId: meFolderPrefDelete
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Dihapus (idempoten) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/files/list:
    get:
      summary: List a folder (sorted in the server, cursor paging)
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Virtual folder path ("/" = user root) }
        - { name: sort, in: query, schema: { type: string, enum: [name, size, type, ext, mtime, btime, atime, mode, note, dimensions, duration], default: name } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: sort2, in: query, schema: { type: string } }
        - { name: dir2, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from nextCursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 }, description: Default LISTING_PAGE_SIZE }
        - { name: foldersFirst, in: query, schema: { type: boolean, default: true } }
        - { name: hidden, in: query, schema: { type: boolean, default: true }, description: Include dotfiles }
        - { name: filter, in: query, schema: { type: string, maxLength: 255 }, description: Case-insensitive substring on the whole folder }
        - { name: types, in: query, schema: { type: string }, description: Comma-separated categories (folder,image,video,audio,archive,code,document,spreadsheet,presentation,pdf,text,font,other) }
        - { name: counts, in: query, schema: { type: boolean, default: false }, description: Fill itemCount for folders on the page (max 2000 per request) }
        - { name: media, in: query, schema: { type: boolean, default: false }, description: Probe up to 50 media files of the page synchronously (Dimensi/Durasi columns); the rest is queued }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/stat:
    get:
      summary: Describe one item
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Item plus stat details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/mkdir:
    post:
      summary: Create a folder
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MkdirRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/create:
    post:
      summary: Create an empty file or one from a template
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/rename:
    post:
      summary: Rename a file or folder (undoable)
      description: Metadata references (favorites, pins, notes, tags, versions) follow the item in one transaction (SPEC §5.7). The response carries a one-time `undoToken` valid for 60 s (SPEC §8.5).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/files/copy:
    post:
      summary: Copy items into a folder
      description: |
        Synchronous up to 2000 entries / 200 MB (`413 PAYLOAD_TOO_LARGE` with `details.reason=task_required` beyond that until the
        task engine of Step 11). Without `onConflict` an occupied destination answers `409 ALREADY_EXISTS` with
        `details.existing`, `details.incoming` and `details.conflicts[]`. Folder onto folder merges with the policy applied per file.
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/move:
    post:
      summary: Move items into a folder (undoable)
      description: Same request and conflict handling as copy. Moving a folder into itself or a descendant answers `400 VALIDATION_FAILED` (`details.reason=cannot_move_into_self`).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/duplicate:
    post:
      summary: Duplicate an item next to itself as "name (n).ext"
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/symlink:
    post:
      summary: Create a symbolic link (relative target inside the root)
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SymlinkRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/chmod:
    post:
      summary: Change permission bits (rwx only; setuid/setgid/sticky are dropped)
      description: "Recursive requests are bounded by the synchronous entry limit (`413` beyond it). Not undoable (`undo` is null)."
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChmodRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/delete:
    post:
      summary: Move items to the Recycle Bin (undoable)
      description: Each item becomes a `trash_items` row and is renamed into `DATA_DIR/trash/<user>/<id>`; one request = one `batchId`. Metadata rows stay so a restore brings favorites/notes/tags back (SPEC §8.5, §8.6).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathsRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/batch-rename/preview:
    post:
      summary: Preview a batch rename rule
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRenameRequest" }
      responses:
        "200":
          description: Preview rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchRenamePreviewResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/batch-rename:
    post:
      summary: Apply a batch rename rule (undoable)
      description: The server recomputes the preview; any collision or invalid name answers `409 CONFLICT` with `details.items`. Renames run in two phases through temporary names and roll back on failure.
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRenameRequest" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/files/undo:
    post:
      summary: Undo the operation identified by a one-time token
      description: Tokens live 60 s in memory and belong to the user who received them (`404` otherwise). A changed state answers `409 CONFLICT` (`details.reason=undo_conflict`).
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UndoRequest" }
      responses:
        "200":
          description: Undone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/sign:
    post:
      summary: Sign URLs for thumbnails (download/media/inline/zip from Step 12b)
      description: Returns short-lived signed URLs (SPEC §8.9, ADR-15). One `path` or a batch `paths` (≤ 500). TTL for `thumb` is MEDIA_URL_TTL.
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignRequest" }
      responses:
        "200":
          description: Signed URL(s)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SignResponse"
                  - $ref: "#/components/schemas/SignBatchResponse"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/files/thumb:
    get:
      summary: Serve a thumbnail (signed URL, no cookie)
      description: |
        Authenticated by the signature only (`<img>` tags, new tabs). `200 image/webp` with `ETag` and
        `Cache-Control: private, max-age=86400` (`304` on `If-None-Match`); `202` + `Retry-After: 2` while
        the thumbnail is being rendered (client retries at most 3×); `404` when the type is unsupported or
        rendering failed (client shows the type icon); `403 SIGNATURE_*`; `429` above 20 parallel requests per user.
      tags: [files]
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: size, in: query, required: true, schema: { type: integer, enum: [128, 256, 512] } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [thumb] } }
        - { name: scope, in: query, required: true, schema: { type: string }, description: "u:<user_id> (share scopes from Step 18a)" }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 }, description: Unix seconds }
        - { name: sig, in: query, required: true, schema: { type: string }, description: base64url HMAC-SHA256, 32 chars }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200":
          description: WebP thumbnail
          content:
            image/webp:
              schema: { type: string, format: binary }
        "202": { description: Rendering in progress; retry after `Retry-After` seconds }
        "304": { description: Not modified }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fm_session
      description: Sesi server-side (SPEC §8.1). Semua request non-GET juga butuh header `X-CSRF-Token`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Item:
      type: object
      description: One directory entry (SPEC §6.3 Item). Metadata slots are null/false until later steps fill them.
      required: [name, path, type, isDir, isSymlink, size, typeLabel, category, ext, mtime, ctime, atime, mode, modeOctal, favorite, pinned, shared, thumb, etag]
      properties:
        name: { type: string }
        path: { type: string, description: Virtual path }
        type: { type: string, enum: [dir, file, symlink] }
        isDir: { type: boolean }
        isSymlink: { type: boolean }
        symlinkTarget: { type: string }
        broken: { type: boolean, description: Symlink that escapes the root, is missing or loops }
        brokenReason: { type: string, enum: [escape, missing, loop, error] }
        size: { type: integer, format: int64 }
        itemCount: { type: integer, format: int64, nullable: true, description: Folder children (null = unknown or more than 10000) }
        mime: { type: string, nullable: true }
        typeLabel: { type: string, description: i18n key such as type.image.jpeg }
        category: { type: string, enum: [folder, image, video, audio, archive, code, document, spreadsheet, presentation, pdf, text, font, other] }
        ext: { type: string }
        mtime: { type: string, format: date-time }
        ctime: { type: string, format: date-time }
        btime: { type: string, format: date-time, nullable: true }
        atime: { type: string, format: date-time }
        mode: { type: string, example: rwxr-xr-x }
        modeOctal: { type: string, example: "755" }
        note: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        favorite: { type: boolean }
        pinned: { type: boolean }
        shared: { type: string, enum: [none, public, users, both] }
        media:
          type: object
          nullable: true
          description: Cached media metadata (media_metadata), null until probed
          properties:
            mime: { type: string, description: From magic bytes }
            width: { type: integer }
            height: { type: integer }
            durationMs: { type: integer, format: int64 }
            codecVideo: { type: string }
            codecAudio: { type: string }
            hasCover: { type: boolean }
            tags:
              type: object
              additionalProperties: { type: string }
              description: title, artist, album, year, track
        thumb: { type: boolean, description: Server can render a thumbnail (false once the pipeline marked the file failed/unsupported) }
        etag: { type: string }
    DirInfo:
      type: object
      required: [path, etag, mtime, itemCount]
      properties:
        path: { type: string }
        etag: { type: string, description: Weak ETag W/"<mtime>-<count>" }
        mtime: { type: string, format: date-time }
        itemCount: { type: integer }
    ListResponse:
      type: object
      required: [items, nextCursor, total, path, parentPath, dir]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextCursor: { type: string, nullable: true }
        total: { type: integer, description: Entries after hidden/filter/types }
        path: { type: string }
        parentPath: { type: string, nullable: true }
        dir: { $ref: "#/components/schemas/DirInfo" }
    StatResponse:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [stat, warnings, versionsCount, shares]
          properties:
            stat:
              type: object
              properties:
                mode: { type: string }
                modeOctal: { type: string }
                atime: { type: string, format: date-time }
                mtime: { type: string, format: date-time }
                ctime: { type: string, format: date-time }
                btime: { type: string, format: date-time, nullable: true }
                nlink: { type: integer }
            warnings:
              type: array
              items: { type: string, enum: [windows_incompatible] }
            versionsCount: { type: integer }
            shares:
              type: array
              items: { type: object }
    MkdirRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Full path of the new folder, or the parent folder when name is given }
        name: { type: string }
        parents: { type: boolean, default: false }
    CreateRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Full path of the new file, or the parent folder when name is given }
        name: { type: string }
        template: { type: string, enum: [txt, md, html, css, js, ts, json, php, py, sh, yaml] }
        content: { type: string, maxLength: 524288, description: Inline content (wins over template) }
    RenameRequest:
      type: object
      required: [path, newName]
      properties:
        path: { type: string }
        newName: { type: string, description: "Alias: new_name" }
    PathRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
    PathsRequest:
      type: object
      required: [paths]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000 }
    ConflictPolicy:
      type: string
      enum: [fail, overwrite, skip, rename]
      description: "fail (default, alias ask) answers 409 ALREADY_EXISTS; overwrite merges folders per file; rename picks name (n).ext"
    TransferRequest:
      type: object
      required: [paths, to]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000, description: "Alias: items" }
        to: { type: string, description: "Destination folder. Alias: dest" }
        onConflict: { $ref: "#/components/schemas/ConflictPolicy" }
        perItem:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ConflictPolicy" }
          description: "Policy per source path (wins over onConflict)"
    SymlinkRequest:
      type: object
      required: [path, target]
      properties:
        path: { type: string, description: "Path of the link" }
        target: { type: string, description: "Relative target resolved inside the root" }
    ChmodRequest:
      type: object
      required: [paths, mode]
      properties:
        paths: { type: array, items: { type: string } }
        mode: { type: string, example: "0644" }
        recursive: { type: boolean, default: false }
        dirMode: { type: string, example: "0755", description: "Folder mode when recursive (default adds x where r is set)" }
    Numbering:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string, example: "foto-{n}", description: "Tokens: {n} counter, {name} current stem, {ext} extension" }
        start: { type: integer, default: 1 }
        step: { type: integer, default: 1 }
        pad: { type: integer, default: 0, maximum: 12 }
    RenameRule:
      type: object
      properties:
        find: { type: string, maxLength: 256 }
        replace: { type: string, description: "$1 refers to regex groups when regex=true" }
        regex: { type: boolean, default: false, description: RE2 syntax (Go regexp) }
        case_insensitive: { type: boolean, default: false }
        numbering: { $ref: "#/components/schemas/Numbering" }
        case: { type: string, enum: [upper, lower, title, none] }
        ext_mode: { type: string, enum: [keep, include], default: keep, description: "keep transforms the stem only; include transforms the whole name" }
    BatchRenameRequest:
      type: object
      required: [paths, rule]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 200, description: "Order defines the numbering" }
        rule: { $ref: "#/components/schemas/RenameRule" }
    PreviewItem:
      type: object
      required: [from, to, status]
      properties:
        from: { type: string }
        to: { type: string }
        status: { type: string, enum: [ok, collision, invalid] }
        reason: { type: string }
    BatchRenamePreviewResponse:
      type: object
      required: [items, clean]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PreviewItem" } }
        clean: { type: boolean }
    UndoRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "Aliases: undoToken, undo_token" }
    ItemResult:
      type: object
      required: [path, status]
      properties:
        path: { type: string }
        to: { type: string }
        status: { type: string, enum: [ok, skipped, overwritten, renamed, merged] }
        isDir: { type: boolean }
        trashId: { type: string }
        warnings: { type: array, items: { type: string } }
    UndoInfo:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [rename, move, restore, delete_created, batch_rename] }
        path: { type: string }
        newName: { type: string }
        items: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string } } } }
        trash: { type: array, items: { type: object, properties: { id: { type: string }, path: { type: string } } } }
        batchId: { type: string }
        created: { type: array, items: { type: string } }
    OpResponse:
      type: object
      required: [results, undo]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/ItemResult" } }
        item: { $ref: "#/components/schemas/Item" }
        batchId: { type: string }
        undoToken: { type: string, description: "One-time token, 60 s; absent when the operation cannot be undone" }
        undo: { oneOf: [{ $ref: "#/components/schemas/UndoInfo" }, { type: "null" }] }
        warnings: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: "#/components/schemas/PreviewItem" }, description: "batch-rename only" }
    ItemResponse:
      type: object
      required: [item, warnings]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        warnings:
          type: array
          items: { type: string, enum: [windows_incompatible] }
    User:
      type: object
      required: [id, username, displayName, role, status, mustChangePassword, homeProvisioned, quotaBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled] }
        mustChangePassword: { type: boolean }
        homeProvisioned: { type: boolean }
        homeWarning: { type: string, enum: [existing_dir_reused] }
        quotaBytes: { type: integer, format: int64 }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ClientConfig:
      type: object
      properties:
        appName: { type: string }
        chunkSize: { type: integer, format: int64 }
        maxUploadSize: { type: integer, format: int64 }
        editorMaxFileSize: { type: integer, format: int64 }
        remoteDownloadEnabled: { type: boolean }
        publicSharesEnabled: { type: boolean }
        shareAllowNoExpiry: { type: boolean }
        shareRequirePassword: { type: boolean }
        passwordMinLength: { type: integer }
        defaultLanguage: { type: string, enum: [id, en] }
        adminCanBrowseUsers: { type: boolean }
        features:
          type: object
          additionalProperties: { type: boolean }
          description: "ffmpeg, ffprobe, vips, pdftoppm, sevenzip, rar, unrar, rg: tool terdeteksi atau tidak"
    ColumnsPref:
      type: object
      description: "Kolom Details view (SPEC §8.4): id ∈ name,size,type,mtime,note,btime,atime,ext,mode,itemCount,dimensions,duration,shared,location; `name` wajib ada di visible"
      properties:
        visible: { type: array, items: { type: string } }
        order: { type: array, items: { type: string } }
        widths: { type: object, additionalProperties: { type: integer, minimum: 40, maximum: 2000 } }
    FolderViewPref:
      type: object
      required: [path, view, sort, columns, updatedAt]
      properties:
        path: { type: string }
        view: { type: string, enum: [details, list, tiles, large, xlarge] }
        sort:
          type: object
          required: [field, dir]
          properties:
            field: { type: string }
            dir: { type: string, enum: [asc, desc] }
            field2: { type: string }
            dir2: { type: string, enum: [asc, desc] }
        columns: { oneOf: [{ $ref: "#/components/schemas/ColumnsPref" }, { type: "null" }] }
        updatedAt: { type: string, format: date-time }
    Preferences:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          additionalProperties: true
          description: "Key terdaftar di SPEC §8.18 (mis. ui.language, ui.theme, view.columns, view.sort, tabs.open); key tak dikenal → 400 VALIDATION_FAILED details.fields.<key>=unknown_key, nilai salah bentuk → invalid_value"
    SignRequest:
      type: object
      required: [purpose]
      properties:
        path: { type: string, description: One path (mutually exclusive with paths) }
        paths: { type: array, items: { type: string }, maxItems: 500 }
        purpose: { type: string, enum: [thumb, download, media, inline, zip], description: Only thumb in Step 8 }
        size: { type: integer, enum: [128, 256, 512], default: 256 }
        share: { type: string, description: Share scope (Step 18a) }
    SignResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, description: "Relative URL (/api/v1/files/thumb?...)" }
        expiresAt: { type: string, format: date-time }
    SignBatchResponse:
      type: object
      required: [urls, expiresAt, invalid]
      properties:
        urls:
          type: array
          items:
            type: object
            required: [path, url]
            properties:
              path: { type: string }
              url: { type: string }
        expiresAt: { type: string, format: date-time }
        invalid: { type: array, items: { type: string }, description: Paths that failed validation (omitted from urls) }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kode error SPEC §6.2
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - PASSWORD_CHANGE_REQUIRED
                - CSRF_INVALID
                - VALIDATION_FAILED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - ALREADY_EXISTS
                - CONFLICT
                - QUOTA_EXCEEDED
                - RATE_LIMITED
                - ACCOUNT_LOCKED
                - ACCOUNT_DISABLED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_TYPE
                - PATH_INVALID
                - NAME_INVALID
                - SYMLINK_ESCAPE
                - OPERATION_IN_PROGRESS
                - TASK_LIMIT
                - ARCHIVE_UNSAFE
                - ARCHIVE_PASSWORD_REQUIRED
                - ARCHIVE_PASSWORD_WRONG
                - ARCHIVE_LIMIT
                - SSRF_BLOCKED
                - SHARE_EXPIRED
                - SHARE_DISABLED
                - SHARE_PASSWORD_REQUIRED
                - SHARE_PASSWORD_WRONG
                - SHARE_LIMIT_REACHED
                - SIGNATURE_INVALID
                - SIGNATURE_EXPIRED
                - DEPENDENCY_MISSING
                - FILE_TOO_LARGE
                - BINARY_FILE
                - INTERNAL
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                requestId:
                  type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
              error:
                type: string
        failed:
          type: array
          items:
            type: string
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
