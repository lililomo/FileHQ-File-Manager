                properties:
                  read: { type: integer, description: Rows changed }
                  unread: { type: integer, description: Remaining unread }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/{id}:
    delete:
      tags: [tasks]
      summary: Delete one notification
      operationId: notificationsDelete
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/remote-downloads:
    post:
      tags: [remote]
      summary: Queue one remote_download task per URL (SPEC §8.10)
      operationId: remoteDownloadsCreate
      description: |
        Each URL becomes a `remote_download` task (progress in bytes, cancel/retry like any task; a retry resumes with `Range`
        from the kept part file when the server supports it). Validation before anything is queued: scheme `http`/`https` only,
        no userinfo, host not `localhost`, port 80/443 or ≥ 1024, literal private/special IPs refused, admin denylist (wins) and
        allowlist (suffix match) → `422 SSRF_BLOCKED` (`details.reason`: scheme, userinfo, host, port, private_ip) or
        `403 FORBIDDEN` (`reason`: denylist, allowlist, disabled). DNS is resolved inside the task: any private/special address
        among the answers fails the task with `SSRF_BLOCKED`; redirects (max 5) are re-validated per hop. 1..10 URLs per request;
        10 tasks per hour per user → `429 RATE_LIMITED` + `Retry-After`. `filename` applies to a single URL (`filenames` maps
        url → name for several); otherwise the name comes from `Content-Disposition`, then the last URL segment, then
        `download-<unix>`. Size limit = min(`REMOTE_DOWNLOAD_MAX_SIZE`, `MAX_UPLOAD_SIZE`) → `FILE_TOO_LARGE`; quota/disk →
        `QUOTA_EXCEEDED`. Audit `remote_download.created` records hosts only; logs never contain query strings.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteDownloadRequest" }
      responses:
        "202":
          description: Tasks queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteDownloadResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/remote-downloads/probe:
    post:
      tags: [remote]
      summary: Inspect a URL before downloading (HEAD, then GET Range 0-0)
      operationId: remoteDownloadsProbe
      description: Same URL/SSRF rules as the create call; answers the final URL (no query string), size when known, suggested file name, Range support and content type.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteProbeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/upload/precheck:
    post:
      tags: [upload]
      summary: Validate planned uploads before the tus session starts (SPEC §8.8 step 2)
      operationId: uploadPrecheck
      description: |
        Per file: `ok`, `conflict` (with the existing item's `size`/`mtime`/`isDir`; `reason: type_mismatch` when a folder is in the way),
        `blocked_ext` (`BLOCKED_EXTENSIONS`), `too_large` (`MAX_UPLOAD_SIZE`) or `name_invalid` (`reason` from `fsjail.ValidateName`).
        `relativePath` is the folder path below `path` for folder uploads ("a/b/c", no file name). `needed` sums the `ok` + `conflict`
        files; `quotaOk` is false when `needed > free` (`quotaReason: quota`) or when the storage disk would drop below its reserve
        (`quotaReason: disk`). `free` already subtracts the reservations of active uploads. Nothing is reserved by this call.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadPrecheckRequest" }
      responses:
        "200":
          description: Verdict per file plus the quota summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPrecheckResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/upload/tus:
    post:
      tags: [upload]
      summary: Create a resumable upload (tus 1.0.0 creation extension)
      operationId: tusCreate
      description: |
        The tus endpoint is `/api/v1/upload/tus/` (trailing slash; both spellings are accepted). Protocol headers: `Tus-Resumable: 1.0.0`,
        `Upload-Length` (bytes; `Upload-Defer-Length` is rejected), `Upload-Metadata` (base64 pairs): `filename` (required), `path` (destination
        folder, required), `relativePath` (folder path below `path` for folder uploads), `onConflict` (`overwrite|skip|rename`, default `rename`),
        `lastModified` (epoch ms → mtime of the final file). Aliases `name`, `dest`, `relPath`, `policy` are accepted.
        Session cookie and `X-CSRF-Token` are required on POST/PATCH/DELETE; `HEAD`/`OPTIONS` need the cookie only.
        Creating reserves `Upload-Length` bytes against the quota (durable: the sum of active sessions survives restarts) and answers
        `201` with an absolute `Location` built from `APP_BASE_URL`. Rejections use the JSON error envelope: `400 NAME_INVALID|PATH_INVALID|VALIDATION_FAILED`,
        `404 NOT_FOUND` (destination folder), `413 PAYLOAD_TOO_LARGE` (above `MAX_UPLOAD_SIZE`) / `413 QUOTA_EXCEEDED`, `415 UNSUPPORTED_TYPE`.
        An empty file (`Upload-Length: 0`) is finalised inside the POST (see the PATCH response headers).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - { name: Upload-Length, in: header, required: true, schema: { type: integer, minimum: 0 } }
        - { name: Upload-Metadata, in: header, required: true, schema: { type: string } }
      responses:
        "201":
          description: Upload created
          headers:
            Location: { schema: { type: string }, description: "Absolute upload URL (APP_BASE_URL + /api/v1/upload/tus/ + id)" }
            Upload-Warnings: { schema: { type: string }, description: "Comma-separated name warnings (e.g. windows_incompatible)" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    options:
      tags: [upload]
      summary: tus capability discovery (`Tus-Version`, `Tus-Extension`, `Tus-Max-Size`)
      operationId: tusOptions
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Protocol headers }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/upload/tus/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Upload id (UUIDv7) from Location" }
    head:
      tags: [upload]
      summary: Current offset of an upload (resume)
      operationId: tusHead
      description: Only the owner of an **active** session sees it; any other id answers `404 NOT_FOUND` (finished, aborted, expired or foreign uploads).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
      responses:
        "200":
          description: Offset known
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [upload]
      summary: Append one chunk (`application/offset+octet-stream`, at most `UPLOAD_CHUNK_SIZE` bytes)
      operationId: tusPatch
      description: |
        `Upload-Offset` must equal the server offset (`409` otherwise). A body larger than `UPLOAD_CHUNK_SIZE` is refused with
        `413 PAYLOAD_TOO_LARGE` (`reason: chunk_too_large`) before it is read. The PATCH that completes the upload also finalises it:
        the stored size is verified, the file is moved atomically into `path/relativePath/filename` (folders created as needed) under
        `onConflict`, quota is committed, `activity_logs` gets `upload`, listings/thumbnails are invalidated and `file.changed` is sent.
        Finalisation answers with `Upload-Result: created|renamed|overwritten|skipped` and `Upload-Path` (percent-encoded virtual path,
        empty when skipped). If the destination folder disappeared the upload is dropped (`404 NOT_FOUND`); a folder in the way of an
        `overwrite` is `400 VALIDATION_FAILED type_mismatch` (upload dropped); a path lock answers `423 OPERATION_IN_PROGRESS` so tus
        clients retry. Excluded from the API timeout and the JSON body limit.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Chunk stored (and, on the last one, the file finalised)
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Result: { schema: { type: string, enum: [created, renamed, overwritten, skipped] } }
            Upload-Path: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Mismatched offset (tus `ERR_MISMATCHED_OFFSET`) }
        "413": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
    delete:
      tags: [upload]
      summary: Abort an upload (tus termination extension); its quota reservation is released
      operationId: tusDelete
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
      responses:
        "204": { description: Upload removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    options:
      tags: [upload]
      summary: tus capability discovery
      operationId: tusOptionsID
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Protocol headers }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fm_session
      description: Sesi server-side (SPEC §8.1). Semua request non-GET juga butuh header `X-CSRF-Token`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    UploadPrecheckRequest:
      type: object
      required: [path, files]
      properties:
        path: { type: string, description: Destination folder (virtual path) }
        files:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [name, size]
            properties:
              name: { type: string }
              size: { type: integer, minimum: 0 }
              relativePath: { type: string, description: Folder path below `path` for folder uploads ("a/b/c") }
    UploadPrecheckItem:
      type: object
      required: [name, path, status]
      properties:
        name: { type: string }
        relativePath: { type: string }
        path: { type: string, description: Virtual path the file would get (empty when the name is invalid) }
        status: { type: string, enum: [ok, conflict, blocked_ext, too_large, name_invalid] }
        reason: { type: string, description: "`type_mismatch` for a folder in the way, the blocked extension, `max_upload_size`, or the `ValidateName` reason" }
        existing:
          type: object
          nullable: true
          properties:
            size: { type: integer }
            mtime: { type: string, format: date-time }
            isDir: { type: boolean }
    UploadPrecheckResponse:
      type: object
      required: [items, quotaOk, needed, free, limit, maxUploadSize, chunkSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UploadPrecheckItem" }
        quotaOk: { type: boolean }
        quotaReason: { type: string, enum: [quota, disk] }
        needed: { type: integer, description: Bytes of the files that would be uploaded (ok + conflict) }
        free: { type: integer, description: Quota left after used, trash, versions and active upload reservations (0 = unlimited quota) }
        limit: { type: integer }
        maxUploadSize: { type: integer }
        chunkSize: { type: integer }
    Item:
      type: object
      description: One directory entry (SPEC §6.3 Item). Metadata slots are null/false until later steps fill them.
      required: [name, path, type, isDir, isSymlink, size, typeLabel, category, ext, mtime, ctime, atime, mode, modeOctal, favorite, pinned, shared, thumb, etag]
      properties:
        name: { type: string }
        path: { type: string, description: Virtual path }
        type: { type: string, enum: [dir, file, symlink] }
        isDir: { type: boolean }
        isSymlink: { type: boolean }
        symlinkTarget: { type: string }
        broken: { type: boolean, description: Symlink that escapes the root, is missing or loops }
        brokenReason: { type: string, enum: [escape, missing, loop, error] }
        size: { type: integer, format: int64 }
        itemCount: { type: integer, format: int64, nullable: true, description: Folder children (null = unknown or more than 10000) }
        mime: { type: string, nullable: true }
        typeLabel: { type: string, description: i18n key such as type.image.jpeg }
        category: { type: string, enum: [folder, image, video, audio, archive, code, document, spreadsheet, presentation, pdf, text, font, other] }
        ext: { type: string }
        mtime: { type: string, format: date-time }
        ctime: { type: string, format: date-time }
        btime: { type: string, format: date-time, nullable: true }
        atime: { type: string, format: date-time }
        mode: { type: string, example: rwxr-xr-x }
        modeOctal: { type: string, example: "755" }
        note: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        favorite: { type: boolean }
        pinned: { type: boolean }
        shared: { type: string, enum: [none, public, users, both] }
        media:
          type: object
          nullable: true
          description: Cached media metadata (media_metadata), null until probed
          properties:
            mime: { type: string, description: From magic bytes }
            width: { type: integer }
            height: { type: integer }
            durationMs: { type: integer, format: int64 }
            codecVideo: { type: string }
            codecAudio: { type: string }
            hasCover: { type: boolean }
            tags:
              type: object
              additionalProperties: { type: string }
              description: title, artist, album, year, track
        thumb: { type: boolean, description: Server can render a thumbnail (false once the pipeline marked the file failed/unsupported) }
        etag: { type: string }
    DirInfo:
      type: object
      required: [path, etag, mtime, itemCount]
      properties:
        path: { type: string }
        etag: { type: string, description: Weak ETag W/"<mtime>-<count>" }
        mtime: { type: string, format: date-time }
        itemCount: { type: integer }
    ListResponse:
      type: object
      required: [items, nextCursor, total, path, parentPath, dir]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextCursor: { type: string, nullable: true }
        total: { type: integer, description: Entries after hidden/filter/types }
        path: { type: string }
        parentPath: { type: string, nullable: true }
        dir: { $ref: "#/components/schemas/DirInfo" }
    StatResponse:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [stat, warnings, versionsCount, shares]
          properties:
            stat:
              type: object
              properties:
                mode: { type: string }
                modeOctal: { type: string }
                atime: { type: string, format: date-time }
                mtime: { type: string, format: date-time }
                ctime: { type: string, format: date-time }
                btime: { type: string, format: date-time, nullable: true }
                nlink: { type: integer }
            warnings:
              type: array
              items: { type: string, enum: [windows_incompatible] }
            versionsCount: { type: integer }
            shares:
              type: array
              items: { type: object }
            checksums:
              type: object
              description: Digests computed earlier for this size+mtime (cache, Step 10a)
              additionalProperties: { type: string }
            dirSize: { $ref: "#/components/schemas/DirSizeResponse" }
    MkdirRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Full path of the new folder, or the parent folder when name is given }
        name: { type: string }
        parents: { type: boolean, default: false }
    CreateRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Full path of the new file, or the parent folder when name is given }
        name: { type: string }
        template: { type: string, enum: [txt, md, html, css, js, ts, json, php, py, sh, yaml] }
        content: { type: string, maxLength: 524288, description: Inline content (wins over template) }
    RenameRequest:
      type: object
      required: [path, newName]
      properties:
        path: { type: string }
        newName: { type: string, description: "Alias: new_name" }
    PathRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
    PathsRequest:
      type: object
      required: [paths]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000 }
    ConflictPolicy:
      type: string
      enum: [fail, overwrite, skip, rename]
      description: "fail (default, alias ask) answers 409 ALREADY_EXISTS; overwrite merges folders per file; rename picks name (n).ext"
    TransferRequest:
      type: object
      required: [paths, to]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000, description: "Alias: items" }
        to: { type: string, description: "Destination folder. Alias: dest" }
        onConflict: { $ref: "#/components/schemas/ConflictPolicy" }
        perItem:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ConflictPolicy" }
          description: "Policy per source path (wins over onConflict)"
    SymlinkRequest:
      type: object
      required: [path, target]
      properties:
        path: { type: string, description: "Path of the link" }
        target: { type: string, description: "Relative target resolved inside the root" }
    ChmodRequest:
      type: object
      required: [paths, mode]
      properties:
        paths: { type: array, items: { type: string } }
        mode: { type: string, example: "0644" }
        recursive: { type: boolean, default: false }
        dirMode: { type: string, example: "0755", description: "Folder mode when recursive (default adds x where r is set)" }
    Numbering:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string, example: "foto-{n}", description: "Tokens: {n} counter, {name} current stem, {ext} extension" }
        start: { type: integer, default: 1 }
        step: { type: integer, default: 1 }
        pad: { type: integer, default: 0, maximum: 12 }
    RenameRule:
      type: object
      properties:
        find: { type: string, maxLength: 256 }
        replace: { type: string, description: "$1 refers to regex groups when regex=true" }
        regex: { type: boolean, default: false, description: RE2 syntax (Go regexp) }
        case_insensitive: { type: boolean, default: false }
        numbering: { $ref: "#/components/schemas/Numbering" }
        case: { type: string, enum: [upper, lower, title, none] }
        ext_mode: { type: string, enum: [keep, include], default: keep, description: "keep transforms the stem only; include transforms the whole name" }
    BatchRenameRequest:
      type: object
      required: [paths, rule]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 200, description: "Order defines the numbering" }
        rule: { $ref: "#/components/schemas/RenameRule" }
    PreviewItem:
      type: object
      required: [from, to, status]
      properties:
        from: { type: string }
        to: { type: string }
        status: { type: string, enum: [ok, collision, invalid] }
        reason: { type: string }
    BatchRenamePreviewResponse:
      type: object
      required: [items, clean]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PreviewItem" } }
        clean: { type: boolean }
    UndoRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "Aliases: undoToken, undo_token" }
    ItemResult:
      type: object
      required: [path, status]
      properties:
        path: { type: string }
        to: { type: string }
        status: { type: string, enum: [ok, skipped, overwritten, renamed, merged] }
        isDir: { type: boolean }
        trashId: { type: string }
        warnings: { type: array, items: { type: string } }
    UndoInfo:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [rename, move, restore, delete_created, batch_rename] }
        path: { type: string }
        newName: { type: string }
        items: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string } } } }
        trash: { type: array, items: { type: object, properties: { id: { type: string }, path: { type: string } } } }
        batchId: { type: string }
        created: { type: array, items: { type: string } }
    OpResponse:
      type: object
      required: [results, undo]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/ItemResult" } }
        item: { $ref: "#/components/schemas/Item" }
        batchId: { type: string }
        undoToken: { type: string, description: "One-time token, 60 s; absent when the operation cannot be undone" }
        undo: { oneOf: [{ $ref: "#/components/schemas/UndoInfo" }, { type: "null" }] }
        warnings: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: "#/components/schemas/PreviewItem" }, description: "batch-rename only" }
    ItemResponse:
      type: object
      required: [item, warnings]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        warnings:
          type: array
          items: { type: string, enum: [windows_incompatible] }
    User:
      type: object
      required: [id, username, displayName, role, status, mustChangePassword, homeProvisioned, quotaBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled] }
        mustChangePassword: { type: boolean }
        homeProvisioned: { type: boolean }
        homeWarning: { type: string, enum: [existing_dir_reused] }
        quotaBytes: { type: integer, format: int64 }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ClientConfig:
      type: object
      properties:
        appName: { type: string }
        chunkSize: { type: integer, format: int64 }
        maxUploadSize: { type: integer, format: int64 }
        editorMaxFileSize: { type: integer, format: int64 }
        remoteDownloadEnabled: { type: boolean }
        publicSharesEnabled: { type: boolean }
        shareAllowNoExpiry: { type: boolean }
        shareRequirePassword: { type: boolean }
        passwordMinLength: { type: integer }
        defaultLanguage: { type: string, enum: [id, en] }
        adminCanBrowseUsers: { type: boolean }
        features:
          type: object
          additionalProperties: { type: boolean }
          description: "ffmpeg, ffprobe, vips, pdftoppm, sevenzip, rar, unrar, rg: tool terdeteksi atau tidak"
    ColumnsPref:
      type: object
      description: "Kolom Details view (SPEC §8.4): id ∈ name,size,type,mtime,note,btime,atime,ext,mode,itemCount,dimensions,duration,shared,location; `name` wajib ada di visible"
      properties:
        visible: { type: array, items: { type: string } }
        order: { type: array, items: { type: string } }
        widths: { type: object, additionalProperties: { type: integer, minimum: 40, maximum: 2000 } }
    FolderViewPref:
      type: object
      required: [path, view, sort, columns, updatedAt]
      properties:
        path: { type: string }
        view: { type: string, enum: [details, list, tiles, large, xlarge] }
        sort:
          type: object
          required: [field, dir]
          properties:
            field: { type: string }
            dir: { type: string, enum: [asc, desc] }
            field2: { type: string }
            dir2: { type: string, enum: [asc, desc] }
        columns: { oneOf: [{ $ref: "#/components/schemas/ColumnsPref" }, { type: "null" }] }
        updatedAt: { type: string, format: date-time }
    Preferences:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          additionalProperties: true
          description: "Key terdaftar di SPEC §8.18 (mis. ui.language, ui.theme, view.columns, view.sort, tabs.open); key tak dikenal → 400 VALIDATION_FAILED details.fields.<key>=unknown_key, nilai salah bentuk → invalid_value"
    QuotaUsage:
      type: object
      required: [quota, limit, used, trash, versions, free, percent, dirty]
      properties:
        quota: { type: integer, format: int64, description: Limit in bytes (users.quota_bytes) }
        limit: { type: integer, format: int64, description: Alias of quota }
        used: { type: integer, format: int64 }
        trash: { type: integer, format: int64 }
        versions: { type: integer, format: int64 }
        reserved: { type: integer, format: int64, description: Bytes held by operations in flight }
        free: { type: integer, format: int64 }
        percent: { type: number, description: "(used+trash+versions+reserved)/quota × 100, one decimal" }
        fileCount: { type: integer, format: int64 }
        dirCount: { type: integer, format: int64 }
        dirty: { type: boolean }
        calculatedAt: { type: string, nullable: true }
    DeletePermanentRequest:
      type: object
      required: [paths]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000 }
        confirm: { type: string, description: "`HAPUS` when more than 50 paths" }
    PermanentResponse:
      allOf:
        - { $ref: "#/components/schemas/OpResponse" }
        - type: object
          required: [deleted, bytesFreed]
          properties:
            deleted: { type: integer }
            bytesFreed: { type: integer, format: int64 }
    DirSizeResponse:
      type: object
      required: [path, size, bytes, files, dirs, partial, calculatedAt]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        bytes: { type: integer, format: int64, description: Alias of size }
        files: { type: integer, format: int64 }
        dirs: { type: integer, format: int64 }
        partial: { type: boolean, description: True when the 60 s budget ran out }
        calculatedAt: { type: string }
        cached: { type: boolean }
    ChecksumRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        algos: { type: array, items: { type: string, enum: [md5, sha1, sha256] }, description: Default all three }
        verify:
          type: object
          required: [algo, expected]
          properties:
            algo: { type: string, enum: [md5, sha1, sha256] }
            expected: { type: string }
    ChecksumResponse:
      type: object
      required: [path]
      properties:
        path: { type: string }
        md5: { type: string }
        sha1: { type: string }
        sha256: { type: string }
        verified: { type: boolean }
        actual: { type: string }
    ChecksumVerifyRequest:
      type: object
      required: [path, algo, expected]
      properties:
        path: { type: string }
        algo: { type: string, enum: [md5, sha1, sha256] }
        expected: { type: string }
    ChecksumVerifyResponse:
      type: object
      required: [path, algo, match, actual]
      properties:
        path: { type: string }
        algo: { type: string }
        match: { type: boolean }
        actual: { type: string }
    TrashItem:
      type: object
      required: [id, name, originalPath, isDir, size, itemCount, kind, deletedAt, expiresAt]
      properties:
        id: { type: string }
        name: { type: string }
        originalPath: { type: string }
        isDir: { type: boolean }
        size: { type: integer, format: int64 }
        itemCount: { type: integer, format: int64 }
        kind: { type: string, enum: [file, folder, image, document, video, audio, archive, other] }
        deletedAt: { type: string }
        expiresAt: { type: string, nullable: true, description: null when retention is 0 }
        batchId: { type: string }
    TrashListResponse:
      type: object
      required: [items, total, totalBytes, nextCursor, retentionDays]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TrashItem" } }
        total: { type: integer, description: Items matching the filter }
        totalBytes: { type: integer, format: int64 }
        nextCursor: { type: string, nullable: true }
        retentionDays: { type: integer, description: 0 = no auto purge }
    TrashRestoreRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string }, maxItems: 2000 }
        to: { type: string, description: Destination folder; omitted = original location }
        onConflict: { $ref: "#/components/schemas/ConflictPolicy" }
        perItem: { type: object, additionalProperties: { $ref: "#/components/schemas/ConflictPolicy" }, description: Keyed by trash id }
    TrashRestoreResult:
      type: object
      required: [id, path, to, status, isDir, size]
      properties:
        id: { type: string }
        path: { type: string, description: Original path }
        to: { type: string, description: Where the item lives now (empty when skipped) }
        status: { type: string, enum: [ok, renamed, overwritten, skipped] }
        isDir: { type: boolean }
        size: { type: integer, format: int64 }
        overwrittenId: { type: string, description: Trash id of the displaced item }
    TrashRestoreResponse:
      type: object
      required: [results, reactivateShares, undo]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/TrashRestoreResult" } }
        reactivateShares: { type: array, items: { type: string } }
        undo: { type: "null" }
    TrashPurgeResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        path: { type: string }
        size: { type: integer, format: int64 }
        isDir: { type: boolean }
        status: { type: string, enum: [ok, gone] }
    TrashPurgeResponse:
      type: object
      required: [results, deleted, bytesFreed, undo]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/TrashPurgeResult" } }
        deleted: { type: integer }
        bytesFreed: { type: integer, format: int64 }
        undo: { type: "null" }
    SignRequest:
      type: object
      properties:
        path: { type: string, description: One path (exactly one of path, paths, items) }
        paths: { type: array, items: { type: string }, maxItems: 500, description: Batch sharing `purpose` }
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/SignItem" }
        purpose: { type: string, enum: [thumb, download, media, inline], description: Required unless every item carries its own }
        size: { type: integer, enum: [128, 256, 512], default: 256, description: Thumbnails only }
        share: { type: string, description: Share scope (Step 18a) }
    SignItem:
      type: object
      required: [path]
      properties:
        path: { type: string }
        purpose: { type: string, enum: [thumb, download, media, inline] }
    SignResponse:
      type: object
      required: [url, expiresAt, purpose]
      properties:
        url: { type: string, description: "Relative URL (/api/v1/files/{thumb|download|raw}?...)" }
        expiresAt: { type: string, format: date-time }
        purpose: { type: string, enum: [thumb, download, media, inline] }
    SignBatchResponse:
      type: object
      required: [urls, expiresAt, invalid]
      properties:
        urls:
          type: array
          items:
            type: object
            required: [path, url, purpose, expiresAt]
            properties:
              path: { type: string }
              url: { type: string }
              purpose: { type: string, enum: [thumb, download, media, inline] }
              expiresAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Earliest expiry in the batch }
        invalid: { type: array, items: { type: string }, description: Paths that failed validation (omitted from urls) }
    ZipRequest:
      type: object
      required: [paths]
      properties:
        paths: { type: array, items: { type: string }, minItems: 1, maxItems: 2000 }
        name: { type: string, description: Archive name without .zip (validated like a file name) }
        method: { type: string, enum: [store, deflate], default: store }
    ZipResponse:
      type: object
      required: [url, expiresAt, name, count]
      properties:
        url: { type: string, description: "Relative signed URL (/api/v1/files/zip?token=…)" }
        expiresAt: { type: string, format: date-time }
        name: { type: string, description: "<folder>.zip, <name>.zip or <app>-<yyyyMMdd-HHmm>.zip" }
        count: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kode error SPEC §6.2
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - PASSWORD_CHANGE_REQUIRED
                - CSRF_INVALID
                - VALIDATION_FAILED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - ALREADY_EXISTS
                - CONFLICT
                - QUOTA_EXCEEDED
                - RATE_LIMITED
                - ACCOUNT_LOCKED
                - ACCOUNT_DISABLED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_TYPE
                - PATH_INVALID
                - NAME_INVALID
                - SYMLINK_ESCAPE
                - OPERATION_IN_PROGRESS
                - TASK_LIMIT
                - ARCHIVE_UNSAFE
                - ARCHIVE_PASSWORD_REQUIRED
                - ARCHIVE_PASSWORD_WRONG
                - ARCHIVE_LIMIT
                - SSRF_BLOCKED
                - SHARE_EXPIRED
                - SHARE_DISABLED
                - SHARE_PASSWORD_REQUIRED
                - SHARE_PASSWORD_WRONG
                - SHARE_LIMIT_REACHED
                - SIGNATURE_INVALID
                - SIGNATURE_EXPIRED
                - DEPENDENCY_MISSING
                - FILE_TOO_LARGE
                - BINARY_FILE
                - INTERNAL
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                requestId:
                  type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
              error:
                type: string
        failed:
          type: array
          items:
            type: string
    TagColor:
      type: string
      enum: [red, orange, yellow, green, blue, purple, gray]
    MetaPathsRequest:
      type: object
      description: "`paths` (batch, max 2000) or the single-item alias `path`; the root folder is never accepted."
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000 }
        path: { type: string }
    MetaResult:
      type: object
      required: [paths, count]
      properties:
        paths: { type: array, items: { type: string } }
        count: { type: integer, description: Rows written (PUT) or removed (DELETE) }
    MetaNoteRequest:
      type: object
      required: [path, note]
      properties:
        path: { type: string }
        note: { type: string, maxLength: 500, description: Plain text (not rendered as Markdown); empty removes the note }
    MetaTagsRequest:
      type: object
      required: [color]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000 }
        path: { type: string }
        color: { $ref: "#/components/schemas/TagColor" }
    ItemsResponse:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        total: { type: integer }
    RecentItem:
      allOf:
        - { $ref: "#/components/schemas/Item" }
        - type: object
          required: [location, action, at]
          properties:
            location: { type: string, description: Parent folder (virtual path) }
            action: { type: string, enum: [open, edit, upload, create, restore] }
            at: { type: string, format: date-time }
    RecentResponse:
      type: object
      required: [items, total, windowDays]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RecentItem" } }
        total: { type: integer }
        windowDays: { type: integer }
    ActivityEntry:
      type: object
      required: [id, at, action, exists]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        action: { type: string, description: rename, move, copy, duplicate, symlink, chmod, delete, batch_rename, undo, restore, purge, purge_auto, trash_empty, delete_permanent, dir_size, checksum, open, create, edit, upload }
        path: { type: string, nullable: true }
        path2: { type: string, nullable: true, description: Destination of rename/move/copy }
        details: { type: object, additionalProperties: true }
        batchId: { type: string, nullable: true }
        exists: { type: boolean, description: The item at `path` still exists }
    ActivityResponse:
      type: object
      required: [items, nextCursor, retentionDays]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ActivityEntry" } }
        nextCursor: { type: string, nullable: true }
        retentionDays: { type: integer }
    AnalysisNode:
      type: object
      required: [name, path, kind, size, files, dirs]
      properties:
        name: { type: string, description: Folder name ("/" for the root; empty for files/other leaves) }
        path: { type: string, description: Folder path (the parent folder for files/other leaves) }
        kind: { type: string, enum: [dir, files, other], description: "dir = folder; files = the parent's direct files; other = merged folders below 0.5 % of the total" }
        size: { type: integer, format: int64 }
        files: { type: integer, format: int64 }
        dirs: { type: integer, format: int64 }
        children:
          type: array
          items: { $ref: "#/components/schemas/AnalysisNode" }
    AnalysisFile:
      type: object
      required: [path, name, size, mtime, category]
      properties:
        path: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        mtime: { type: string, format: date-time }
        category: { type: string }
    StorageAnalysis:
      type: object
      required: [generatedAt, computedAt, partial, total, files, dirs, tree, topFiles, byType, cached, durationMs]
      properties:
        generatedAt: { type: string, format: date-time }
        computedAt: { type: string, format: date-time, description: Alias of generatedAt (SPEC name) }
        partial: { type: boolean, description: True when the 60 s budget ran out }
        total: { type: integer, format: int64, description: Bytes below the user root (= quota.used) }
        files: { type: integer, format: int64 }
        dirs: { type: integer, format: int64 }
        tree: { $ref: "#/components/schemas/AnalysisNode" }
        topFiles: { type: array, items: { $ref: "#/components/schemas/AnalysisFile" }, maxItems: 50 }
        byType:
          type: object
          description: Keys image, video, audio, document, archive, other
          additionalProperties:
            type: object
            properties:
              bytes: { type: integer, format: int64 }
              files: { type: integer, format: int64 }
        trash: { type: integer, format: int64 }
        versions: { type: integer, format: int64 }
        quota:
          type: object
          properties:
            limit: { type: integer, format: int64 }
            used: { type: integer, format: int64 }
            free: { type: integer, format: int64 }
            percent: { type: number }
            dirty: { type: boolean }
        cached: { type: boolean }
        durationMs: { type: integer, format: int64 }
    TaskState:
      type: string
      enum: [queued, running, done, failed, cancelled, interrupted]
    TaskProgress:
      type: object
      required: [done, total, unit, percent]
      properties:
        done: { type: integer, format: int64 }
        total: { type: integer, format: int64, description: 0 = unknown }
        unit: { type: string, enum: [bytes, items] }
        percent: { type: number }
    TaskError:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "SPEC §6.2 code, CANCELLED or INTERRUPTED" }
        message: { type: string }
    Task:
      type: object
      description: Task view (SPEC §6.3 "Tasks & events"). `payload` never contains secrets; `result` depends on `type` (SPEC §7.1).
      required: [id, type, state, title, payload, progress, cancelRequested, cancelable, retryable, createdAt]
      properties:
        id: { type: string }
        type: { type: string, description: "copy, move, dir_size, checksum, remote_download, … (SPEC §7.1)" }
        state: { $ref: "#/components/schemas/TaskState" }
        title: { type: string }
        payload: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true, nullable: true }
        error: { $ref: "#/components/schemas/TaskError" }
        progress: { $ref: "#/components/schemas/TaskProgress" }
        etaSeconds: { type: integer, format: int64, nullable: true }
        speedBps: { type: integer, format: int64, nullable: true, description: Units per second over the last 10 s }
        cancelRequested: { type: boolean }
        cancelable: { type: boolean }
        retryable: { type: boolean }
        retryOf: { type: string, description: Id of the task this one retries }
        createdAt: { type: string }
        startedAt: { type: string, nullable: true }
        finishedAt: { type: string, nullable: true }
    TaskResponse:
      type: object
      required: [task]
      properties:
        task: { $ref: "#/components/schemas/Task" }
    RemoteDownloadRequest:
      type: object
      required: [urls, path]
      properties:
        urls: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uri } }
        path: { type: string, description: "Destination folder (virtual path); alias `dest`" }
        filename: { type: string, description: "Single URL only; no path separators" }
        filenames: { type: object, additionalProperties: { type: string }, description: "url → file name for several URLs" }
        onConflict: { type: string, enum: [fail, overwrite, skip, rename], default: fail, description: "aliases `policy`, `on_conflict`" }
    RemoteDownloadResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    RemoteProbeResult:
      type: object
      required: [finalUrl, acceptsRanges, size]
      properties:
        finalUrl: { type: string }
        size: { type: integer, nullable: true }
        filename: { type: string }
        acceptsRanges: { type: boolean }
        contentType: { type: string }
    TaskAccepted:
      type: object
      description: "`202` answer of an operation converted into a task"
      required: [task]
      properties:
        task: { $ref: "#/components/schemas/Task" }
    TaskListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Task" } }
        nextCursor: { type: string }
    TaskLogEntry:
      type: object
      required: [id, at, level, message]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string }
        level: { type: string, enum: [info, warn, error] }
        message: { type: string }
    Notification:
      type: object
      required: [id, type, title, readAt, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [task_done, task_failed, share_received, share_upload, system] }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: Frontend route }
        readAt: { type: string, nullable: true }
        createdAt: { type: string }
    NotificationListResponse:
      type: object
      required: [items, unread]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        nextCursor: { type: string }
        unread: { type: integer }
    NotificationsReadRequest:
      type: object
      properties:
        ids: { type: array, items: { type: string }, maxItems: 200 }
        all: { type: boolean }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
