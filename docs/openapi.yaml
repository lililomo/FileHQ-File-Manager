      operationId: notificationsRead
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationsReadRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
