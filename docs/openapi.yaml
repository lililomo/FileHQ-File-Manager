      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharePage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/shares/by-path:
    get:
      tags: [shares]
      summary: Shares of one item of the caller (badge / dialog)
      operationId: sharesByPath
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Share" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/shares/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [shares]
      summary: One share of the caller (another owner's id → 404)
      operationId: sharesGet
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Share, content: { application/json: { schema: { type: object, properties: { share: { $ref: "#/components/schemas/Share" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [shares]
      summary: Update protection/options; `password:null` removes the password, `disabled` toggles the link
      operationId: sharesUpdate
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareInput" }
      responses:
        "200": { description: Updated share, content: { application/json: { schema: { type: object, properties: { share: { $ref: "#/components/schemas/Share" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "FORBIDDEN: disabled by an administrator", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [shares]
      summary: Delete a share (access logs cascade)
      operationId: sharesDelete
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/shares/{id}/disable:
    post:
      tags: [shares]
      summary: Disable a link temporarily (reason manual)
      operationId: sharesDisable
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Share, content: { application/json: { schema: { type: object, properties: { share: { $ref: "#/components/schemas/Share" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/shares/{id}/enable:
    post:
      tags: [shares]
      summary: Enable a link again (also after a Recycle Bin restore; admin_revoked/owner_disabled → 403)
      operationId: sharesEnable
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Share, content: { application/json: { schema: { type: object, properties: { share: { $ref: "#/components/schemas/Share" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/shares/{id}/regenerate-token:
    post:
      tags: [shares]
      summary: Replace the token (old link stops working; a custom slug is dropped)
      operationId: sharesRegenerateToken
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Share + url, content: { application/json: { schema: { type: object, properties: { share: { $ref: "#/components/schemas/Share" }, url: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/shares/{id}/access-logs:
    get:
      tags: [shares]
      summary: Access journal of a share (IP truncated to /24 or /48), newest first
      operationId: sharesAccessLogs
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareAccessLogPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: "43-char token or custom slug" }
    get:
      tags: [public]
      summary: Guest metadata of a link (SPEC §6.6). Before an unlock only the password state is revealed; counts one view per visitor per day (cookie fm_pv)
      operationId: publicShareMeta
      security: []
      responses:
        "200": { description: Meta, content: { application/json: { schema: { $ref: "#/components/schemas/PublicShareMeta" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "410": { description: "SHARE_EXPIRED / SHARE_DISABLED (reason manual|owner_disabled|item_trashed|admin_revoked|broken|locked)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/unlock:
    post:
      tags: [public]
      summary: Verify the link password; sets cookie fm_share_<id> for /s/<token> and the API path (1 h). Limits 10/10 min per link+IP, 30/10 min per IP; 50 failures/h lock the link for an hour
      operationId: publicShareUnlock
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        "204": { description: Unlocked (Set-Cookie) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: SHARE_PASSWORD_WRONG, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/list:
    get:
      tags: [public]
      summary: Read-only listing inside a shared folder (`path` relative to it; nothing above it exists; dotfiles hidden)
      operationId: publicShareList
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: "/" } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: Listing, content: { application/json: { schema: { $ref: "#/components/schemas/ListResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: SHARE_PASSWORD_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "hide_listing", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/stat:
    get:
      tags: [public]
      summary: Item + stat inside the share (`path` relative; "/" = the shared item)
      operationId: publicShareStat
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: "/" } }
      responses:
        "200": { description: Item, content: { application/json: { schema: { $ref: "#/components/schemas/StatResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/content:
    get:
      tags: [public]
      summary: Decoded text of a file inside the share (≤ 1 MB, read-only)
      operationId: publicShareContent
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: "/" } }
        - { name: encoding, in: query, schema: { type: string } }
      responses:
        "200": { description: Content, content: { application/json: { schema: { $ref: "#/components/schemas/FileContent" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/media-info:
    get:
      tags: [public]
      summary: Viewer metadata of a file inside the share (never GPS; subtitles with public URLs)
      operationId: publicShareMediaInfo
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: "/" } }
      responses:
        "200": { description: Media info, content: { application/json: { schema: { $ref: "#/components/schemas/MediaInfo" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/thumb:
    get:
      tags: [public]
      summary: Thumbnail of an item inside the share (owner's pipeline; symlinks refused)
      operationId: publicShareThumb
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: "/" } }
        - { name: size, in: query, schema: { type: integer, enum: [128, 256, 512], default: 256 } }
      responses:
        "200": { description: image/webp }
        "202": { description: Rendering (Retry-After) }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/raw:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, schema: { type: string, default: "/" } }
      - { name: purpose, in: query, schema: { type: string, enum: [media, inline], default: media } }
      - { name: variant, in: query, schema: { type: string, enum: [preview, thumb] } }
    head:
      tags: [public]
      summary: Headers of raw content (same parameters as GET)
      operationId: publicShareRawHead
      security: []
      responses:
        "200": { description: Headers }
    get:
      tags: [public]
      summary: Inline/media content of a file inside the share (Range; inline policy of ADR-06; `variant` = preview 2048 px / thumb 512)
      operationId: publicShareRaw
      security: []
      responses:
        "200": { description: Content }
        "206": { description: Partial content }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/download:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, schema: { type: string, default: "/" } }
    head:
      tags: [public]
      summary: Headers of a download (not counted)
      operationId: publicShareDownloadHead
      security: []
      responses:
        "200": { description: Headers }
    get:
      tags: [public]
      summary: Attachment download of one file; counts against maxDownloads (once per download, Range continuations excluded); preview-only links → 403
      operationId: publicShareDownload
      security: []
      responses:
        "200": { description: Content }
        "206": { description: Partial content }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "preview_only", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "410": { description: "SHARE_LIMIT_REACHED / SHARE_EXPIRED / SHARE_DISABLED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/public/shares/{token}/zip:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [public]
      summary: Prepare a zip of paths inside a shared folder (`["/"]` = everything) → `{url}` valid 10 minutes
      operationId: publicShareZipCreate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [paths], properties: { paths: { type: array, items: { type: string } }, name: { type: string } } }
      responses:
        "200": { description: "`url`, `name`, `count`", content: { application/json: { schema: { type: object, properties: { url: { type: string }, name: { type: string }, count: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
    head:
      tags: [public]
      summary: Headers of a zip stream
      operationId: publicShareZipHead
      security: []
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Headers }
    get:
      tags: [public]
      summary: Stream the prepared zip (counts as one download)
      operationId: publicShareZipGet
      security: []
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: application/zip }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/subtitle:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, required: true, schema: { type: string } }
    head:
      tags: [public]
      summary: Headers of a subtitle
      operationId: publicShareSubtitleHead
      security: []
      responses:
        "200": { description: Headers }
    get:
      tags: [public]
      summary: Sidecar subtitle inside the share as sanitised WebVTT
      operationId: publicShareSubtitle
      security: []
      responses:
        "200": { description: text/vtt }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/upload/precheck:
    post:
      tags: [public]
      summary: File request precheck (folder = the shared one; conflicts become renames)
      operationId: publicShareUploadPrecheck
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [files], properties: { files: { type: array, items: { $ref: "#/components/schemas/UploadPrecheckItem" } } } }
      responses:
        "200": { description: Verdicts, content: { application/json: { schema: { $ref: "#/components/schemas/UploadPrecheckResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "upload_disabled", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/public/shares/{token}/upload/tus:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [public]
      summary: Create a file-request upload (tus creation; as the owner, into the shared folder, policy rename, owner quota; `Location` points at the public endpoint)
      operationId: publicShareTusCreate
      security: []
      responses:
        "201": { description: Upload created }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    options:
      tags: [public]
      summary: tus capability discovery
      operationId: publicShareTusOptions
      security: []
      responses:
        "200": { description: Protocol headers }
  /api/v1/public/shares/{token}/upload/tus/{id}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    head:
      tags: [public]
      summary: Offset of a file-request upload (ids of other shares look non-existent)
      operationId: publicShareTusHead
      security: []
      responses:
        "200": { description: "`Upload-Offset`" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [public]
      summary: Append a chunk (≤ UPLOAD_CHUNK_SIZE); the last chunk lands the file
      operationId: publicShareTusPatch
      security: []
      responses:
        "204": { description: Chunk stored }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
    delete:
      tags: [public]
      summary: Abort a file-request upload
      operationId: publicShareTusDelete
      security: []
      responses:
        "204": { description: Aborted }
        "404": { $ref: "#/components/responses/Error" }
    options:
      tags: [public]
      summary: tus capability discovery
      operationId: publicShareTusIdOptions
      security: []
      responses:
        "200": { description: Protocol headers }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fm_session
      description: Sesi server-side (SPEC §8.1). Semua request non-GET juga butuh header `X-CSRF-Token`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Share:
      type: object
      description: Owner view of a share (SPEC §6.3). `url` is empty when the stored token can no longer be decrypted.
      properties:
        id: { type: string }
        path: { type: string }
        name: { type: string }
        isDir: { type: boolean }
        mode: { type: string, enum: [public, users] }
        slug: { type: [string, "null"] }
        hasPassword: { type: boolean }
        expiresAt: { type: [string, "null"] }
        maxDownloads: { type: [integer, "null"] }
        downloadCount: { type: integer }
        viewCount: { type: integer }
        allowDownload: { type: boolean }
        allowUpload: { type: boolean }
        hideOwner: { type: boolean }
        hideListing: { type: boolean }
        note: { type: [string, "null"] }
        disabledAt: { type: [string, "null"] }
        disabledReason: { type: [string, "null"], enum: [manual, owner_disabled, item_trashed, admin_revoked, null] }
        brokenAt: { type: [string, "null"] }
        lastAccessAt: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        url: { type: string }
        status: { type: string, enum: [active, disabled, expired, broken] }
    ShareInput:
      type: object
      description: "Create: `path` + options. PATCH: any subset; `password: null` removes the password, `expiresInDays: 0` or `expiresAt: null` = no expiry (when allowed), `disabled` toggles."
      properties:
        path: { type: string }
        mode: { type: string, enum: [public, users], default: public }
        slug: { type: [string, "null"], pattern: "^[a-z0-9][a-z0-9-]{2,63}$" }
        password: { type: [string, "null"], minLength: 4, maxLength: 128 }
        expiresAt: { type: [string, "null"] }
        expiresInDays: { type: [integer, "null"], minimum: 0, maximum: 3650 }
        maxDownloads: { type: [integer, "null"], minimum: 0 }
        allowDownload: { type: boolean, default: true }
        allowUpload: { type: boolean, default: false }
        hideOwner: { type: boolean, default: false }
        hideListing: { type: boolean, default: false }
        note: { type: [string, "null"], maxLength: 500 }
        disabled: { type: boolean }
    SharePage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Share" } }
        nextCursor: { type: [string, "null"] }
    ShareAccessLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              at: { type: string }
              ipTrunc: { type: string }
              action: { type: string, enum: [view, list, download, zip, unlock_ok, unlock_fail, upload, denied] }
              path: { type: [string, "null"] }
              userId: { type: [string, "null"] }
              userAgent: { type: string }
        nextCursor: { type: [string, "null"] }
    PublicShareMeta:
      type: object
      description: Guest metadata. Locked links (password not yet given) only carry `isDir`, `passwordRequired`, `unlocked`, the policy flags and `expiresAt`.
      properties:
        name: { type: string }
        isDir: { type: boolean }
        size: { type: integer }
        mime: { type: [string, "null"] }
        category: { type: string }
        mtime: { type: string }
        itemCount: { type: [integer, "null"] }
        owner: { type: string }
        note: { type: [string, "null"] }
        allowDownload: { type: boolean }
        allowUpload: { type: boolean }
        hideListing: { type: boolean }
        expiresAt: { type: [string, "null"] }
        passwordRequired: { type: boolean }
        unlocked: { type: boolean }
        downloadLimitReached: { type: boolean }
        maxDownloads: { type: [integer, "null"] }
        downloadCount: { type: integer }
    UploadPrecheckRequest:
      type: object
      required: [path, files]
      properties:
        path: { type: string, description: Destination folder (virtual path) }
        files:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [name, size]
            properties:
              name: { type: string }
              size: { type: integer, minimum: 0 }
              relativePath: { type: string, description: Folder path below `path` for folder uploads ("a/b/c") }
    UploadPrecheckItem:
      type: object
      required: [name, path, status]
      properties:
        name: { type: string }
        relativePath: { type: string }
        path: { type: string, description: Virtual path the file would get (empty when the name is invalid) }
        status: { type: string, enum: [ok, conflict, blocked_ext, too_large, name_invalid] }
        reason: { type: string, description: "`type_mismatch` for a folder in the way, the blocked extension, `max_upload_size`, or the `ValidateName` reason" }
        existing:
          type: object
          nullable: true
          properties:
            size: { type: integer }
            mtime: { type: string, format: date-time }
            isDir: { type: boolean }
    UploadPrecheckResponse:
      type: object
      required: [items, quotaOk, needed, free, limit, maxUploadSize, chunkSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UploadPrecheckItem" }
        quotaOk: { type: boolean }
        quotaReason: { type: string, enum: [quota, disk] }
        needed: { type: integer, description: Bytes of the files that would be uploaded (ok + conflict) }
        free: { type: integer, description: Quota left after used, trash, versions and active upload reservations (0 = unlimited quota) }
        limit: { type: integer }
        maxUploadSize: { type: integer }
        chunkSize: { type: integer }
    Item:
      type: object
      description: One directory entry (SPEC §6.3 Item). Metadata slots are null/false until later steps fill them.
      required: [name, path, type, isDir, isSymlink, size, typeLabel, category, ext, mtime, ctime, atime, mode, modeOctal, favorite, pinned, shared, thumb, etag]
      properties:
        name: { type: string }
        path: { type: string, description: Virtual path }
        type: { type: string, enum: [dir, file, symlink] }
        isDir: { type: boolean }
        isSymlink: { type: boolean }
        symlinkTarget: { type: string }
        broken: { type: boolean, description: Symlink that escapes the root, is missing or loops }
        brokenReason: { type: string, enum: [escape, missing, loop, error] }
        size: { type: integer, format: int64 }
        itemCount: { type: integer, format: int64, nullable: true, description: Folder children (null = unknown or more than 10000) }
        mime: { type: string, nullable: true }
        typeLabel: { type: string, description: i18n key such as type.image.jpeg }
        category: { type: string, enum: [folder, image, video, audio, archive, code, document, spreadsheet, presentation, pdf, text, font, other] }
        ext: { type: string }
        mtime: { type: string, format: date-time }
        ctime: { type: string, format: date-time }
        btime: { type: string, format: date-time, nullable: true }
        atime: { type: string, format: date-time }
        mode: { type: string, example: rwxr-xr-x }
        modeOctal: { type: string, example: "755" }
        note: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        favorite: { type: boolean }
        pinned: { type: boolean }
        shared: { type: string, enum: [none, public, users, both] }
        media:
          type: object
          nullable: true
          description: Cached media metadata (media_metadata), null until probed
          properties:
            mime: { type: string, description: From magic bytes }
            width: { type: integer }
            height: { type: integer }
            durationMs: { type: integer, format: int64 }
            codecVideo: { type: string }
            codecAudio: { type: string }
            hasCover: { type: boolean }
            tags:
              type: object
              additionalProperties: { type: string }
              description: title, artist, album, year, track
        thumb: { type: boolean, description: Server can render a thumbnail (false once the pipeline marked the file failed/unsupported) }
        etag: { type: string }
    DirInfo:
      type: object
      required: [path, etag, mtime, itemCount]
      properties:
        path: { type: string }
        etag: { type: string, description: Weak ETag W/"<mtime>-<count>" }
        mtime: { type: string, format: date-time }
        itemCount: { type: integer }
    ListResponse:
      type: object
      required: [items, nextCursor, total, path, parentPath, dir]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextCursor: { type: string, nullable: true }
        total: { type: integer, description: Entries after hidden/filter/types }
        path: { type: string }
        parentPath: { type: string, nullable: true }
        dir: { $ref: "#/components/schemas/DirInfo" }
    MediaInfo:
      type: object
      required: [path, name, size, mtime, category, mime, kind, hasCover, exif]
      properties:
        path: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        mtime: { type: string, format: date-time }
        category: { type: string }
        mime: { type: string, description: From magic bytes once probed, else from the extension }
        kind: { type: string, enum: [image, svg, video, audio, pdf, other] }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer, format: int64 }
        codecVideo: { type: string }
        codecAudio: { type: string }
        bitrate: { type: integer, format: int64 }
        hasCover: { type: boolean }
        tags:
          type: object
          additionalProperties: { type: string }
        thumbState: { type: string, enum: [pending, ready, failed, unsupported] }
        exif:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Exif"
            - type: object
              required: [hasGps]
              properties:
                hasGps: { type: boolean, description: A position is stored; request it with include_gps=1 }
        gps:
          type: object
          description: Only with include_gps=1
          required: [lat, lon]
          properties:
            lat: { type: number }
            lon: { type: number }
            alt: { type: number }
        subtitles:
          type: array
          description: Videos only (Step 17b) — sidecar `<name>.vtt|srt` and `<name>.<label>.vtt|srt` in the same folder; omitted when none
          items:
            type: object
            required: [path, name, label, format, url]
            properties:
              path: { type: string }
              name: { type: string }
              lang: { type: string, description: "Language tag when the label is one (en, id, pt-BR)" }
              label: { type: string }
              format: { type: string, enum: [vtt, srt] }
              url: { type: string, description: Signed GET /files/subtitle URL }
    MediaPosition:
      type: object
      required: [path, seconds, updatedAt]
      properties:
        path: { type: string }
        seconds: { type: number }
        duration: { type: number }
        updatedAt: { type: string, format: date-time, nullable: true }
    Exif:
      type: object
      description: EXIF subset (SPEC §4.2 exif_json); absent fields were not in the file
      properties:
        make: { type: string }
        model: { type: string }
        lens: { type: string }
        software: { type: string }
        dateTimeOriginal: { type: string, example: "2024-04-30T18:05:00", description: Local camera time, no zone }
        dateTime: { type: string }
        exposureTime: { type: string, example: "1/250" }
        fNumber: { type: number }
        iso: { type: integer }
        focalLength: { type: number, description: mm }
        focalLength35: { type: integer }
        orientation: { type: integer, minimum: 1, maximum: 8 }
        flash: { type: boolean }
        width: { type: integer }
        height: { type: integer }
    StatResponse:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [stat, warnings, versionsCount, shares]
          properties:
            stat:
              type: object
              properties:
                mode: { type: string }
                modeOctal: { type: string }
                atime: { type: string, format: date-time }
                mtime: { type: string, format: date-time }
                ctime: { type: string, format: date-time }
                btime: { type: string, format: date-time, nullable: true }
                nlink: { type: integer }
            warnings:
              type: array
              items: { type: string, enum: [windows_incompatible] }
            versionsCount: { type: integer }
            shares:
              type: array
              items: { type: object }
            checksums:
              type: object
              description: Digests computed earlier for this size+mtime (cache, Step 10a)
              additionalProperties: { type: string }
            dirSize: { $ref: "#/components/schemas/DirSizeResponse" }
    MkdirRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Full path of the new folder, or the parent folder when name is given }
        name: { type: string }
        parents: { type: boolean, default: false }
    CreateRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Full path of the new file, or the parent folder when name is given }
        name: { type: string }
        template: { type: string, enum: [txt, md, html, css, js, ts, json, php, py, sh, yaml] }
        content: { type: string, maxLength: 524288, description: Inline content (wins over template) }
    RenameRequest:
      type: object
      required: [path, newName]
      properties:
        path: { type: string }
        newName: { type: string, description: "Alias: new_name" }
    PathRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
    PathsRequest:
      type: object
      required: [paths]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000 }
    ConflictPolicy:
      type: string
      enum: [fail, overwrite, skip, rename]
      description: "fail (default, alias ask) answers 409 ALREADY_EXISTS; overwrite merges folders per file; rename picks name (n).ext"
    TransferRequest:
      type: object
      required: [paths, to]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000, description: "Alias: items" }
        to: { type: string, description: "Destination folder. Alias: dest" }
        onConflict: { $ref: "#/components/schemas/ConflictPolicy" }
        perItem:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ConflictPolicy" }
          description: "Policy per source path (wins over onConflict)"
    SymlinkRequest:
      type: object
      required: [path, target]
      properties:
        path: { type: string, description: "Path of the link" }
        target: { type: string, description: "Relative target resolved inside the root" }
    ChmodRequest:
      type: object
      required: [paths, mode]
      properties:
        paths: { type: array, items: { type: string } }
        mode: { type: string, example: "0644" }
        recursive: { type: boolean, default: false }
        dirMode: { type: string, example: "0755", description: "Folder mode when recursive (default adds x where r is set)" }
    Numbering:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string, example: "foto-{n}", description: "Tokens: {n} counter, {name} current stem, {ext} extension" }
        start: { type: integer, default: 1 }
        step: { type: integer, default: 1 }
        pad: { type: integer, default: 0, maximum: 12 }
    RenameRule:
      type: object
      properties:
        find: { type: string, maxLength: 256 }
        replace: { type: string, description: "$1 refers to regex groups when regex=true" }
        regex: { type: boolean, default: false, description: RE2 syntax (Go regexp) }
        case_insensitive: { type: boolean, default: false }
        numbering: { $ref: "#/components/schemas/Numbering" }
        case: { type: string, enum: [upper, lower, title, none] }
        ext_mode: { type: string, enum: [keep, include], default: keep, description: "keep transforms the stem only; include transforms the whole name" }
    BatchRenameRequest:
      type: object
      required: [paths, rule]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 200, description: "Order defines the numbering" }
        rule: { $ref: "#/components/schemas/RenameRule" }
    PreviewItem:
      type: object
      required: [from, to, status]
      properties:
        from: { type: string }
        to: { type: string }
        status: { type: string, enum: [ok, collision, invalid] }
        reason: { type: string }
    BatchRenamePreviewResponse:
      type: object
      required: [items, clean]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PreviewItem" } }
        clean: { type: boolean }
    UndoRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "Aliases: undoToken, undo_token" }
    ItemResult:
      type: object
      required: [path, status]
      properties:
        path: { type: string }
        to: { type: string }
        status: { type: string, enum: [ok, skipped, overwritten, renamed, merged] }
        isDir: { type: boolean }
        trashId: { type: string }
        warnings: { type: array, items: { type: string } }
    UndoInfo:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [rename, move, restore, delete_created, batch_rename] }
        path: { type: string }
        newName: { type: string }
        items: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string } } } }
        trash: { type: array, items: { type: object, properties: { id: { type: string }, path: { type: string } } } }
        batchId: { type: string }
        created: { type: array, items: { type: string } }
    OpResponse:
      type: object
      required: [results, undo]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/ItemResult" } }
        item: { $ref: "#/components/schemas/Item" }
        batchId: { type: string }
        undoToken: { type: string, description: "One-time token, 60 s; absent when the operation cannot be undone" }
        undo: { oneOf: [{ $ref: "#/components/schemas/UndoInfo" }, { type: "null" }] }
        warnings: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: "#/components/schemas/PreviewItem" }, description: "batch-rename only" }
    ItemResponse:
      type: object
      required: [item, warnings]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        warnings:
          type: array
          items: { type: string, enum: [windows_incompatible] }
    User:
      type: object
      required: [id, username, displayName, role, status, mustChangePassword, homeProvisioned, quotaBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled] }
        mustChangePassword: { type: boolean }
        homeProvisioned: { type: boolean }
        homeWarning: { type: string, enum: [existing_dir_reused] }
        quotaBytes: { type: integer, format: int64 }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ClientConfig:
      type: object
      properties:
        appName: { type: string }
        chunkSize: { type: integer, format: int64 }
        maxUploadSize: { type: integer, format: int64 }
        editorMaxFileSize: { type: integer, format: int64 }
        remoteDownloadEnabled: { type: boolean }
        publicSharesEnabled: { type: boolean }
        shareAllowNoExpiry: { type: boolean }
        shareRequirePassword: { type: boolean }
        passwordMinLength: { type: integer }
        defaultLanguage: { type: string, enum: [id, en] }
        adminCanBrowseUsers: { type: boolean }
        features:
          type: object
          additionalProperties: { type: boolean }
          description: "ffmpeg, ffprobe, vips, pdftoppm, sevenzip, rar, unrar, rg: tool terdeteksi atau tidak"
    ColumnsPref:
      type: object
      description: "Kolom Details view (SPEC §8.4): id ∈ name,size,type,mtime,note,btime,atime,ext,mode,itemCount,dimensions,duration,shared,location; `name` wajib ada di visible"
      properties:
        visible: { type: array, items: { type: string } }
        order: { type: array, items: { type: string } }
        widths: { type: object, additionalProperties: { type: integer, minimum: 40, maximum: 2000 } }
    FolderViewPref:
      type: object
      required: [path, view, sort, columns, updatedAt]
      properties:
        path: { type: string }
        view: { type: string, enum: [details, list, tiles, large, xlarge] }
        sort:
          type: object
          required: [field, dir]
          properties:
            field: { type: string }
            dir: { type: string, enum: [asc, desc] }
            field2: { type: string }
            dir2: { type: string, enum: [asc, desc] }
        columns: { oneOf: [{ $ref: "#/components/schemas/ColumnsPref" }, { type: "null" }] }
        updatedAt: { type: string, format: date-time }
    Preferences:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          additionalProperties: true
          description: "Key terdaftar di SPEC §8.18 (mis. ui.language, ui.theme, view.columns, view.sort, tabs.open); key tak dikenal → 400 VALIDATION_FAILED details.fields.<key>=unknown_key, nilai salah bentuk → invalid_value"
    QuotaUsage:
      type: object
      required: [quota, limit, used, trash, versions, free, percent, dirty]
      properties:
        quota: { type: integer, format: int64, description: Limit in bytes (users.quota_bytes) }
        limit: { type: integer, format: int64, description: Alias of quota }
        used: { type: integer, format: int64 }
        trash: { type: integer, format: int64 }
        versions: { type: integer, format: int64 }
        reserved: { type: integer, format: int64, description: Bytes held by operations in flight }
        free: { type: integer, format: int64 }
        percent: { type: number, description: "(used+trash+versions+reserved)/quota × 100, one decimal" }
        fileCount: { type: integer, format: int64 }
        dirCount: { type: integer, format: int64 }
        dirty: { type: boolean }
        calculatedAt: { type: string, nullable: true }
    DeletePermanentRequest:
      type: object
      required: [paths]
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000 }
        confirm: { type: string, description: "`HAPUS` when more than 50 paths" }
    PermanentResponse:
      allOf:
        - { $ref: "#/components/schemas/OpResponse" }
        - type: object
          required: [deleted, bytesFreed]
          properties:
            deleted: { type: integer }
            bytesFreed: { type: integer, format: int64 }
    DirSizeResponse:
      type: object
      required: [path, size, bytes, files, dirs, partial, calculatedAt]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        bytes: { type: integer, format: int64, description: Alias of size }
        files: { type: integer, format: int64 }
        dirs: { type: integer, format: int64 }
        partial: { type: boolean, description: True when the 60 s budget ran out }
        calculatedAt: { type: string }
        cached: { type: boolean }
    ChecksumRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        algos: { type: array, items: { type: string, enum: [md5, sha1, sha256] }, description: Default all three }
        verify:
          type: object
          required: [algo, expected]
          properties:
            algo: { type: string, enum: [md5, sha1, sha256] }
            expected: { type: string }
    ChecksumResponse:
      type: object
      required: [path]
      properties:
        path: { type: string }
        md5: { type: string }
        sha1: { type: string }
        sha256: { type: string }
        verified: { type: boolean }
        actual: { type: string }
    ChecksumVerifyRequest:
      type: object
      required: [path, algo, expected]
      properties:
        path: { type: string }
        algo: { type: string, enum: [md5, sha1, sha256] }
        expected: { type: string }
    ChecksumVerifyResponse:
      type: object
      required: [path, algo, match, actual]
      properties:
        path: { type: string }
        algo: { type: string }
        match: { type: boolean }
        actual: { type: string }
    TrashItem:
      type: object
      required: [id, name, originalPath, isDir, size, itemCount, kind, deletedAt, expiresAt]
      properties:
        id: { type: string }
        name: { type: string }
        originalPath: { type: string }
        isDir: { type: boolean }
        size: { type: integer, format: int64 }
        itemCount: { type: integer, format: int64 }
        kind: { type: string, enum: [file, folder, image, document, video, audio, archive, other] }
        deletedAt: { type: string }
        expiresAt: { type: string, nullable: true, description: null when retention is 0 }
        batchId: { type: string }
    TrashListResponse:
      type: object
      required: [items, total, totalBytes, nextCursor, retentionDays]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TrashItem" } }
        total: { type: integer, description: Items matching the filter }
        totalBytes: { type: integer, format: int64 }
        nextCursor: { type: string, nullable: true }
        retentionDays: { type: integer, description: 0 = no auto purge }
    TrashRestoreRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string }, maxItems: 2000 }
        to: { type: string, description: Destination folder; omitted = original location }
        onConflict: { $ref: "#/components/schemas/ConflictPolicy" }
        perItem: { type: object, additionalProperties: { $ref: "#/components/schemas/ConflictPolicy" }, description: Keyed by trash id }
    TrashRestoreResult:
      type: object
      required: [id, path, to, status, isDir, size]
      properties:
        id: { type: string }
        path: { type: string, description: Original path }
        to: { type: string, description: Where the item lives now (empty when skipped) }
        status: { type: string, enum: [ok, renamed, overwritten, skipped] }
        isDir: { type: boolean }
        size: { type: integer, format: int64 }
        overwrittenId: { type: string, description: Trash id of the displaced item }
    TrashRestoreResponse:
      type: object
      required: [results, reactivateShares, undo]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/TrashRestoreResult" } }
        reactivateShares: { type: array, items: { type: string } }
        undo: { type: "null" }
    TrashPurgeResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        path: { type: string }
        size: { type: integer, format: int64 }
        isDir: { type: boolean }
        status: { type: string, enum: [ok, gone] }
    TrashPurgeResponse:
      type: object
      required: [results, deleted, bytesFreed, undo]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/TrashPurgeResult" } }
        deleted: { type: integer }
        bytesFreed: { type: integer, format: int64 }
        undo: { type: "null" }
    SignRequest:
      type: object
      properties:
        path: { type: string, description: One path (exactly one of path, paths, items) }
        paths: { type: array, items: { type: string }, maxItems: 500, description: Batch sharing `purpose` }
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/SignItem" }
        purpose: { type: string, enum: [thumb, download, media, inline], description: Required unless every item carries its own }
        size: { type: integer, enum: [128, 256, 512], default: 256, description: Thumbnails only }
        share: { type: string, description: Share scope (Step 18a) }
    SignItem:
      type: object
      required: [path]
      properties:
        path: { type: string }
        purpose: { type: string, enum: [thumb, download, media, inline] }
    SignResponse:
      type: object
      required: [url, expiresAt, purpose]
      properties:
        url: { type: string, description: "Relative URL (/api/v1/files/{thumb|download|raw}?...)" }
        expiresAt: { type: string, format: date-time }
        purpose: { type: string, enum: [thumb, download, media, inline] }
    SignBatchResponse:
      type: object
      required: [urls, expiresAt, invalid]
      properties:
        urls:
          type: array
          items:
            type: object
            required: [path, url, purpose, expiresAt]
            properties:
              path: { type: string }
              url: { type: string }
              purpose: { type: string, enum: [thumb, download, media, inline] }
              expiresAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Earliest expiry in the batch }
        invalid: { type: array, items: { type: string }, description: Paths that failed validation (omitted from urls) }
    ZipRequest:
      type: object
      required: [paths]
      properties:
        paths: { type: array, items: { type: string }, minItems: 1, maxItems: 2000 }
        name: { type: string, description: Archive name without .zip (validated like a file name) }
        method: { type: string, enum: [store, deflate], default: store }
    ZipResponse:
      type: object
      required: [url, expiresAt, name, count]
      properties:
        url: { type: string, description: "Relative signed URL (/api/v1/files/zip?token=…)" }
        expiresAt: { type: string, format: date-time }
        name: { type: string, description: "<folder>.zip, <name>.zip or <app>-<yyyyMMdd-HHmm>.zip" }
        count: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kode error SPEC §6.2
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - PASSWORD_CHANGE_REQUIRED
                - CSRF_INVALID
                - VALIDATION_FAILED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - ALREADY_EXISTS
                - CONFLICT
                - QUOTA_EXCEEDED
                - RATE_LIMITED
                - ACCOUNT_LOCKED
                - ACCOUNT_DISABLED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_TYPE
                - PATH_INVALID
                - NAME_INVALID
                - SYMLINK_ESCAPE
                - OPERATION_IN_PROGRESS
                - TASK_LIMIT
                - ARCHIVE_UNSAFE
                - ARCHIVE_PASSWORD_REQUIRED
                - ARCHIVE_PASSWORD_WRONG
                - ARCHIVE_LIMIT
                - SSRF_BLOCKED
                - SHARE_EXPIRED
                - SHARE_DISABLED
                - SHARE_PASSWORD_REQUIRED
                - SHARE_PASSWORD_WRONG
                - SHARE_LIMIT_REACHED
                - SIGNATURE_INVALID
                - SIGNATURE_EXPIRED
                - DEPENDENCY_MISSING
                - FILE_TOO_LARGE
                - BINARY_FILE
                - INTERNAL
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                requestId:
                  type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
              error:
                type: string
        failed:
          type: array
          items:
            type: string
    TagColor:
      type: string
      enum: [red, orange, yellow, green, blue, purple, gray]
    MetaPathsRequest:
      type: object
      description: "`paths` (batch, max 2000) or the single-item alias `path`; the root folder is never accepted."
      properties:
        paths: { type: array, items: { type: string }, maxItems: 2000 }
        path: { type: string }
    MetaResult:
      type: object
      required: [paths, count]
