  /api/v1/me/storage-analysis:
    get:
      summary: Storage analysis of the user root (treemap depth 3, 50 largest files, totals per type)
      description: One walk with a 60 s budget (`partial:true` when cut, Step 11 turns it into a task), cached 10 minutes per user and dropped by any file mutation. Sizes follow quota accounting (regular files + symlink sizes) so `total` equals `quota.used`.
      tags: [me]
      operationId: meStorageAnalysis
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK (cached or freshly computed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageAnalysis" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Recompute the storage analysis now ("Hitung ulang")
      tags: [me]
      operationId: meStorageAnalysisRecompute
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Recomputed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageAnalysis" }
        "202":
          description: Walk cut by the 60 s budget — the partial report plus `task` (type `dir_size`, `payload.analysis=true`) that completes it (Step 11).
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/StorageAnalysis" }
                  - { $ref: "#/components/schemas/TaskAccepted" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/tasks:
