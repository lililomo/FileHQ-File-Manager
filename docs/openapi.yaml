openapi: 3.1.0
info:
  title: FileManager API
  version: 0.1.0
  description: |
    REST API aplikasi File Manager multi-user `file.kppbwi.app` (SPEC §6).
    Kerangka ini dibuat di Step 1 dan diperluas setiap step. Base path API: `/api/v1`.
    Semua error memakai envelope `{"error":{"code","message","details"}}`.
servers:
  - url: https://file.kppbwi.app
    description: Produksi (di belakang Nginx aaPanel)
  - url: http://127.0.0.1:8080
    description: Lokal (binary langsung)

tags:
  - name: system
    description: Kesehatan proses dan informasi build
  - name: auth
    description: Login, sesi, CSRF, ganti password (SPEC §8.1)
  - name: me
    description: Profil dan preferensi user (SPEC §8.18)

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness
      description: Selalu 200 selama proses hidup. Boleh dipublikasikan lewat Nginx (rate limit 60/menit per IP).
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
  /readyz:
    get:
      tags: [system]
      summary: Readiness
      description: Memeriksa DATA_DIR writable, STORAGE_ROOT readable (DB ditambah Step 2). Hanya loopback (tidak di-proxy Nginx).
      operationId: readyz
      responses:
        "200":
          description: Siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/version:
    get:
      tags: [system]
      summary: Versi aplikasi dan nama aplikasi
      operationId: version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, appName]
                properties:
                  version:
                    type: string
                  appName:
                    type: string

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login dengan username dan password
      description: |
        Rate limit 20 request/menit per IP (`429 RATE_LIMITED`). Lima kegagalan dalam 15 menit mengunci akun
        secara bertahap 1/5/15/60 menit (`423 ACCOUNT_LOCKED`). Kegagalan selalu dijawab `401 UNAUTHENTICATED`
        dengan pesan generik. Sukses mengirim cookie `fm_session` (HttpOnly, Secure, SameSite=Lax) dan token CSRF.
        Request lintas situs (`Sec-Fetch-Site: cross-site` atau `Origin` asing) ditolak `403 CSRF_INVALID`.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024, format: password }
                totp: { type: string, description: "Kode TOTP 6 digit (fase akhir, Step 23a)" }
      responses:
        "200":
          description: Login berhasil
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "fm_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=<SESSION_ABSOLUTE_TIMEOUT>"
          content:
            application/json:
              schema:
                type: object
                required: [user, mustChangePassword, csrfToken]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  mustChangePassword: { type: boolean }
                  csrfToken: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: "UNAUTHENTICATED — username atau password salah", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "ACCOUNT_DISABLED atau CSRF_INVALID", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423":
          description: ACCOUNT_LOCKED — `details.retryAfter` detik
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: RATE_LIMITED
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout (mencabut sesi saat ini)
      operationId: authLogout
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        "204": { description: Sesi dicabut, cookie dihapus }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/csrf:
    get:
      tags: [auth]
      summary: Token CSRF untuk sesi ini
      operationId: authCsrf
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: User saat ini, preferensi ringkas, dan konfigurasi client
      description: Tetap dapat diakses saat `mustChangePassword` (endpoint lain menjawab `403 PASSWORD_CHANGE_REQUIRED`).
      operationId: authMe
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user, config]
                properties:
                  user:
                    allOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        properties:
                          quota:
                            type: object
                            properties:
                              limit: { type: integer, format: int64 }
                              used: { type: integer, format: int64, description: "0 sampai Step 10a" }
                              trash: { type: integer, format: int64 }
                              versions: { type: integer, format: int64 }
                          language: { type: string, enum: [id, en] }
                          prefs: { type: object, additionalProperties: true }
                  config: { $ref: "#/components/schemas/ClientConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: ACCOUNT_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Ganti password (wajib saat login pertama)
      description: |
        Kebijakan SPEC §10.4: minimal `PASSWORD_MIN_LENGTH` (12), maksimal 128 karakter, bukan password umum,
        tidak mengandung username, tidak sama dengan password sekarang maupun password awal. Sukses mencabut
        semua sesi lain dan menghapus `mustChangePassword`. Rate limit 5 percobaan terverifikasi / 15 menit per sesi.
      operationId: authChangePassword
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password diganti }
        "400":
          description: "VALIDATION_FAILED — `details.fields.newPassword` ∈ too_short|too_long|common|contains_username|same_as_current|same_as_initial|invalid_encoding, atau `details.fields.currentPassword: incorrect`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: CSRF_INVALID, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429":
          description: RATE_LIMITED
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/me/preferences:
    get:
      tags: [me]
      summary: Preferensi user (dokumen JSON)
      operationId: mePreferencesGet
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: PASSWORD_CHANGE_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [me]
      summary: Merge-patch preferensi (`null` menghapus key)
      operationId: mePreferencesPut
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Preferensi setelah patch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { description: "PAYLOAD_TOO_LARGE — dokumen > 64 KB", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/me/folder-prefs:
    get:
      tags: [me]
      summary: Preferensi tampilan satu folder (view, sort, kolom)
      operationId: meFolderPrefGet
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Path virtual folder }
      responses:
        "200":
          description: "`pref` null jika belum ada"
          content:
            application/json:
              schema:
                type: object
                required: [pref]
                properties:
                  pref: { oneOf: [{ $ref: "#/components/schemas/FolderViewPref" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "NOT_FOUND — path reserved (.system)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [me]
      summary: Simpan preferensi tampilan satu folder (maks 500 folder per user, LRU)
      operationId: meFolderPrefPut
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                view: { type: string, enum: [details, list, tiles, large, xlarge], default: details }
                sort: { type: string, enum: [name, size, type, ext, mtime, btime, atime, mode, note, dimensions, duration], default: name }
                dir: { type: string, enum: [asc, desc], default: asc }
                sort2: { type: string }
                dir2: { type: string, enum: [asc, desc] }
                columns: { $ref: "#/components/schemas/ColumnsPref" }
      responses:
        "200":
          description: Preferensi tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [pref]
                properties:
                  pref: { $ref: "#/components/schemas/FolderViewPref" }
        "400": { description: "VALIDATION_FAILED — details.fields.{view,sort,dir,sort2,dir2,columns}", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      summary: Hapus preferensi tampilan satu folder
      operationId: meFolderPrefDelete
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Dihapus (idempoten) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/files/list:
    get:
      summary: List a folder (sorted in the server, cursor paging)
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Virtual folder path ("/" = user root) }
        - { name: sort, in: query, schema: { type: string, enum: [name, size, type, ext, mtime, btime, atime, mode, note, dimensions, duration], default: name } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: sort2, in: query, schema: { type: string } }
        - { name: dir2, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from nextCursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 }, description: Default LISTING_PAGE_SIZE }
        - { name: foldersFirst, in: query, schema: { type: boolean, default: true } }
        - { name: hidden, in: query, schema: { type: boolean, default: true }, description: Include dotfiles }
        - { name: filter, in: query, schema: { type: string, maxLength: 255 }, description: Case-insensitive substring on the whole folder }
        - { name: types, in: query, schema: { type: string }, description: Comma-separated categories (folder,image,video,audio,archive,code,document,spreadsheet,presentation,pdf,text,font,other) }
        - { name: counts, in: query, schema: { type: boolean, default: false }, description: Fill itemCount for folders on the page (max 2000 per request) }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/stat:
    get:
      summary: Describe one item
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Item plus stat details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/mkdir:
    post:
      summary: Create a folder
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MkdirRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/files/create:
    post:
      summary: Create an empty file or one from a template
      tags: [files]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fm_session
      description: Sesi server-side (SPEC §8.1). Semua request non-GET juga butuh header `X-CSRF-Token`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Item:
      type: object
      description: One directory entry (SPEC §6.3 Item). Metadata slots are null/false until later steps fill them.
      required: [name, path, type, isDir, isSymlink, size, typeLabel, category, ext, mtime, ctime, atime, mode, modeOctal, favorite, pinned, shared, thumb, etag]
      properties:
        name: { type: string }
        path: { type: string, description: Virtual path }
        type: { type: string, enum: [dir, file, symlink] }
        isDir: { type: boolean }
        isSymlink: { type: boolean }
        symlinkTarget: { type: string }
        broken: { type: boolean, description: Symlink that escapes the root, is missing or loops }
        brokenReason: { type: string, enum: [escape, missing, loop, error] }
        size: { type: integer, format: int64 }
        itemCount: { type: integer, format: int64, nullable: true, description: Folder children (null = unknown or more than 10000) }
        mime: { type: string, nullable: true }
        typeLabel: { type: string, description: i18n key such as type.image.jpeg }
        category: { type: string, enum: [folder, image, video, audio, archive, code, document, spreadsheet, presentation, pdf, text, font, other] }
        ext: { type: string }
        mtime: { type: string, format: date-time }
        ctime: { type: string, format: date-time }
        btime: { type: string, format: date-time, nullable: true }
        atime: { type: string, format: date-time }
        mode: { type: string, example: rwxr-xr-x }
        modeOctal: { type: string, example: "755" }
        note: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        favorite: { type: boolean }
        pinned: { type: boolean }
        shared: { type: string, enum: [none, public, users, both] }
        media:
          type: object
          nullable: true
          properties:
            width: { type: integer }
            height: { type: integer }
            durationMs: { type: integer, format: int64 }
        thumb: { type: boolean, description: Server can render a thumbnail }
        etag: { type: string }
    DirInfo:
      type: object
      required: [path, etag, mtime, itemCount]
      properties:
        path: { type: string }
        etag: { type: string, description: Weak ETag W/"<mtime>-<count>" }
        mtime: { type: string, format: date-time }
        itemCount: { type: integer }
    ListResponse:
      type: object
      required: [items, nextCursor, total, path, parentPath, dir]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextCursor: { type: string, nullable: true }
        total: { type: integer, description: Entries after hidden/filter/types }
        path: { type: string }
        parentPath: { type: string, nullable: true }
        dir: { $ref: "#/components/schemas/DirInfo" }
    StatResponse:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [stat, warnings, versionsCount, shares]
          properties:
            stat:
              type: object
              properties:
                mode: { type: string }
                modeOctal: { type: string }
                atime: { type: string, format: date-time }
                mtime: { type: string, format: date-time }
                ctime: { type: string, format: date-time }
                btime: { type: string, format: date-time, nullable: true }
                nlink: { type: integer }
            warnings:
              type: array
              items: { type: string, enum: [windows_incompatible] }
            versionsCount: { type: integer }
            shares:
              type: array
              items: { type: object }
    MkdirRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Full path of the new folder, or the parent folder when name is given }
        name: { type: string }
        parents: { type: boolean, default: false }
    CreateRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Full path of the new file, or the parent folder when name is given }
        name: { type: string }
        template: { type: string, enum: [txt, md, html, css, js, ts, json, php, py, sh, yaml] }
        content: { type: string, maxLength: 524288, description: Inline content (wins over template) }
    ItemResponse:
      type: object
      required: [item, warnings]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        warnings:
          type: array
          items: { type: string, enum: [windows_incompatible] }
    User:
      type: object
      required: [id, username, displayName, role, status, mustChangePassword, homeProvisioned, quotaBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled] }
        mustChangePassword: { type: boolean }
        homeProvisioned: { type: boolean }
        homeWarning: { type: string, enum: [existing_dir_reused] }
        quotaBytes: { type: integer, format: int64 }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ClientConfig:
      type: object
      properties:
        appName: { type: string }
        chunkSize: { type: integer, format: int64 }
        maxUploadSize: { type: integer, format: int64 }
        editorMaxFileSize: { type: integer, format: int64 }
        remoteDownloadEnabled: { type: boolean }
        publicSharesEnabled: { type: boolean }
        shareAllowNoExpiry: { type: boolean }
        shareRequirePassword: { type: boolean }
        passwordMinLength: { type: integer }
        defaultLanguage: { type: string, enum: [id, en] }
        adminCanBrowseUsers: { type: boolean }
        features:
          type: object
          additionalProperties: { type: boolean }
          description: "ffmpeg, ffprobe, vips, pdftoppm, sevenzip, rar, unrar, rg: tool terdeteksi atau tidak"
    ColumnsPref:
      type: object
      description: "Kolom Details view (SPEC §8.4): id ∈ name,size,type,mtime,note,btime,atime,ext,mode,itemCount,dimensions,duration,shared,location; `name` wajib ada di visible"
      properties:
        visible: { type: array, items: { type: string } }
        order: { type: array, items: { type: string } }
        widths: { type: object, additionalProperties: { type: integer, minimum: 40, maximum: 2000 } }
    FolderViewPref:
      type: object
      required: [path, view, sort, columns, updatedAt]
      properties:
        path: { type: string }
        view: { type: string, enum: [details, list, tiles, large, xlarge] }
        sort:
          type: object
          required: [field, dir]
          properties:
            field: { type: string }
            dir: { type: string, enum: [asc, desc] }
            field2: { type: string }
            dir2: { type: string, enum: [asc, desc] }
        columns: { oneOf: [{ $ref: "#/components/schemas/ColumnsPref" }, { type: "null" }] }
        updatedAt: { type: string, format: date-time }
    Preferences:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          additionalProperties: true
          description: "Key terdaftar di SPEC §8.18 (mis. ui.language, ui.theme, view.columns, view.sort, tabs.open); key tak dikenal → 400 VALIDATION_FAILED details.fields.<key>=unknown_key, nilai salah bentuk → invalid_value"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kode error SPEC §6.2
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - PASSWORD_CHANGE_REQUIRED
                - CSRF_INVALID
                - VALIDATION_FAILED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - ALREADY_EXISTS
                - CONFLICT
                - QUOTA_EXCEEDED
                - RATE_LIMITED
                - ACCOUNT_LOCKED
                - ACCOUNT_DISABLED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_TYPE
                - PATH_INVALID
                - NAME_INVALID
                - SYMLINK_ESCAPE
                - OPERATION_IN_PROGRESS
                - TASK_LIMIT
                - ARCHIVE_UNSAFE
                - ARCHIVE_PASSWORD_REQUIRED
                - ARCHIVE_PASSWORD_WRONG
                - ARCHIVE_LIMIT
                - SSRF_BLOCKED
                - SHARE_EXPIRED
                - SHARE_DISABLED
                - SHARE_PASSWORD_REQUIRED
                - SHARE_PASSWORD_WRONG
                - SHARE_LIMIT_REACHED
                - SIGNATURE_INVALID
                - SIGNATURE_EXPIRED
                - DEPENDENCY_MISSING
                - FILE_TOO_LARGE
                - BINARY_FILE
                - INTERNAL
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                requestId:
                  type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
              error:
                type: string
        failed:
          type: array
          items:
            type: string
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
