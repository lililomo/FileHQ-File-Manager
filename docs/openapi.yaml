        "404": { $ref: "#/components/responses/Error" }
  /api/v1/archives/capabilities:
    get:
      tags: [archives]
      summary: Archive format matrix as supported on this server (SPEC §8.11)
      operationId: archivesCapabilities
      description: |
        Static matrix adjusted to the installed tools: without the 7-Zip binary (`SEVENZIP_PATH`) 7z cannot be written and
        iso cannot be read (`reason: dependency_missing`); rar is read-only (`reason: rar_licence`). `passwordStdin` is the
        Step 14a spike result: 7-Zip 23.01 reads passwords from a stdin pipe, so they never appear in process arguments.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveCapabilities" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/archives/compress:
    post:
      tags: [archives]
      summary: Queue a compress task (SPEC §8.11)
      operationId: archivesCompress
      description: |
        Validates sources (exist, not root, single-file formats take exactly one regular file), format/level, password
        support (zip → WinZip AES-256, 7z → AES-256 via the 7-Zip CLI with the password on stdin; `encryptNames` = `-mhe=on`,
        `splitVolumeMb` = `-v`), the archive name (`<ext>` appended when missing, blocked extensions refused) and that the
        output is not inside a source. The archive is written under `DATA_DIR/tmp/ar-<task>` and moved atomically into the
        destination; an existing name gets ` (n)`. `deleteSource` moves the originals to the Recycle Bin after success.
        Progress unit: bytes read. The password lives only in the engine's memory: a retry of a password task fails with
        `ARCHIVE_PASSWORD_REQUIRED`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveCompressRequest" }
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/archives/extract:
    post:
      tags: [archives]
      summary: Queue an extract task (SPEC §8.11)
      operationId: archivesExtract
      description: |
        The format is detected from magic bytes (extension only decides tar.gz vs gz); unknown → `415 UNSUPPORTED_TYPE`.
        `dest`: `new` (folder named after the archive next to it, default), `here` (the archive's folder) or a folder path
        (parent must exist). Entries are normalised (backslashes, `./`, NFC) and validated per segment; absolute names, `..`,
        drive letters or NUL fail the whole task with `ARCHIVE_UNSAFE` (`details.reason`), other invalid names, device/FIFO
        entries, links that resolve outside the destination, hard links and blocked extensions are skipped and listed in
        `result.skipped`. Limits (`ARCHIVE_LIMIT`, `details.reason`: entries | max_extract_size | quota | disk) use the
        container index when there is one and are enforced again while streaming; a 200:1 ratio above 1 GiB is
        `ARCHIVE_UNSAFE` (reason ratio). Files are written to `DATA_DIR/tmp/ar-<task>/root` (mode 0640/0750, setuid bits
        dropped, mtime kept, symlinks created last) and moved into the destination with the conflict policy (folders merge
        per file under `overwrite`; `fail` answers `ALREADY_EXISTS` with `details.conflicts` before touching anything).
        Encrypted archives without a password fail with `ARCHIVE_PASSWORD_REQUIRED`, a wrong one with
        `ARCHIVE_PASSWORD_WRONG`. iso and multi-volume 7z go through the 7-Zip CLI (`501 DEPENDENCY_MISSING` when absent).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveExtractRequest" }
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/archives/entries:
    get:
      tags: [archives]
      summary: List one folder of an archive without extracting it (SPEC §8.11 archive browser)
      operationId: archivesEntries
      description: |
        The member list is read once (zip/7z/rar headers, a single pass for tar.* streams, `7z l -slt` for iso) and
        cached in memory per (user, archive, size, mtime, encoding) for 10 minutes, so navigating inside the archive
        never re-reads the file. Folders first in natural order; parents that have no member of their own are
        synthesised (`implicit: true`). Pages of ≤ 1000 with an opaque `cursor`. The password of an encrypted archive
        travels in the `X-Archive-Password` header — a `password` query parameter is refused with `400` — is verified
        against the first encrypted member and remembered server-side for 10 minutes under a random `session` id that
        `POST /archives/sign` attaches to entry URLs. An encrypted archive still lists without a password (members
        flagged `encrypted`); only their content needs it. Wrong password → `422 ARCHIVE_PASSWORD_WRONG`.
        `supportsModify` is true only for an unencrypted zip ≤ 2 GiB (`modifyReason` otherwise: format | encrypted |
        too_large_to_modify). Names that cannot be mapped to a path (absolute, `..`, NUL) are left out and counted in
        `unsafe`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Archive file (virtual path) }
        - { name: inner, in: query, schema: { type: string }, description: "Folder inside the archive ('' = root)" }
        - { name: encoding, in: query, schema: { type: string, enum: [auto, utf-8, gbk, cp437, shift_jis, big5, windows-1252], default: auto }, description: "Legacy name encoding of zip entries without the UTF-8 flag (alias name_encoding)" }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
        - { name: X-Archive-Password, in: header, schema: { type: string, maxLength: 256 }, description: Password of an encrypted archive (never a query parameter, never logged) }
      responses:
        "200":
          description: One page of one archive folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveEntriesResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/archives/sign:
    post:
      tags: [archives]
      summary: Sign an entry-content URL for one member (purpose entry)
      operationId: archivesSign
      description: |
        The in-archive counterpart of `POST /files/sign`: a signed URL of `GET /archives/entry-content` for one member
        (`purpose=entry`, TTL `MEDIA_URL_TTL`). For an encrypted archive the client passes the `session` id it received
        from `GET /archives/entries`; it is appended unsigned (`&sess=`) and resolved server-side to the password, so the
        password itself never appears in a URL. Unknown, expired or another user's session → `404`
        (`reason: session_expired`).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveSignRequest" }
      responses:
        "200":
          description: Signed entry URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveSignResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/archives/entry-content:
    head:
      tags: [archives]
      summary: Headers of one streamed member (same parameters as GET)
      operationId: archivesEntryContentHead
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: inner, in: query, required: true, schema: { type: string } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [entry] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
        - { name: sess, in: query, schema: { type: string } }
      responses:
        "200": { description: Headers only }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      tags: [archives]
      summary: Stream one member straight out of its archive (signed URL, no cookie)
      operationId: archivesEntryContent
      description: |
        Authenticated by the signature only (`<img>`, `fetch`, `<a download>`). The member is decoded on the fly
        (random access for zip/7z/rar, a forward walk for tar.* streams) and written to the response: nothing is
        extracted to `DATA_DIR/tmp`. Limit 50 MB per member (`413 FILE_TOO_LARGE`); iso members cannot be previewed
        (`415`, reason cli_only). The inline policy of `/files/raw` applies (ADR-06: raster images, audio and video
        inline; text, PDF and the rest attachments; HTML/SVG/XML/JS/CSS always `application/octet-stream`), the MIME
        type is sniffed from the first bytes, `Cache-Control: private, max-age=300`, no Range support. Encrypted member
        without a session → `401 ARCHIVE_PASSWORD_REQUIRED`; `sess` unknown, expired or of another user → `404`.
        Counts against the per-user download concurrency limit (`429`).
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Archive file }
        - { name: inner, in: query, required: true, schema: { type: string }, description: Member path inside the archive (signed) }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [entry] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
        - { name: sess, in: query, schema: { type: string }, description: Archive session id from GET /archives/entries (unsigned bearer bound to the user and the archive) }
      responses:
        "200":
          description: Member bytes (inline or attachment per policy)
          content:
            "*/*":
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/archives/extract-entries:
    post:
      tags: [archives]
      summary: Queue an extract task limited to selected members (SPEC §8.11)
      operationId: archivesExtractEntries
      description: |
        The same `extract` task as `POST /archives/extract` with `entries` (a folder name includes everything below
        it), but the names are checked against the archive index first: an unknown member answers `404`
        (`reason: entry_not_found`, `details.entries`) and nothing is queued. The password travels in the JSON body;
        the task payload only records `hasPassword`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveExtractEntriesRequest" }
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/archives/add:
    post:
      tags: [archives]
      summary: Queue a zip_edit task that adds files or folders to an unencrypted zip (SPEC §8.11)
      operationId: archivesAdd
      description: |
        Zip only: other formats, encrypted zips and archives above 2 GiB answer `415 UNSUPPORTED_TYPE`
        (`reason: format | encrypted | too_large_to_modify`). Sources (1..1000 files or folders of the user's root;
        blocked extensions refused, the archive itself refused with `reason: into_itself`) land under `innerDir`
        (`''` = root); folders are walked, symlinks and special files are skipped and listed in `result.skipped`.
        The task rewrites the zip in `DATA_DIR/tmp/ar-<task>`: kept members are copied raw (`OpenRaw`/`CreateRaw`,
        no re-compression; a new file with the same name replaces the old member), new files are deflated, the
        result is verified and renamed over the original, so a failure or a cancel leaves the original untouched.
        Progress unit: bytes (archive size + new bytes). Quota is reserved for the new bytes and committed with the
        real size delta.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveAddRequest" }
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/archives/remove-entries:
    post:
      tags: [archives]
      summary: Queue a zip_edit task that removes members from an unencrypted zip (SPEC §8.11)
      operationId: archivesRemoveEntries
      description: |
        Entries (1..1000; a folder name removes everything below it) must exist in the index (`404` otherwise).
        Same rewrite and guarantees as `POST /archives/add`. `POST /archives/remove-entry` is an alias that also
        accepts a single `entry`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveRemoveRequest" }
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/archives/remove-entry:
    post:
      tags: [archives]
      summary: Alias of POST /archives/remove-entries (PROMPT Step 14b name)
      operationId: archivesRemoveEntry
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveRemoveRequest" }
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/remote-downloads:
    post:
      tags: [remote]
      summary: Queue one remote_download task per URL (SPEC §8.10)
      operationId: remoteDownloadsCreate
      description: |
        Each URL becomes a `remote_download` task (progress in bytes, cancel/retry like any task; a retry resumes with `Range`
        from the kept part file when the server supports it). Validation before anything is queued: scheme `http`/`https` only,
        no userinfo, host not `localhost`, port 80/443 or ≥ 1024, literal private/special IPs refused, admin denylist (wins) and
        allowlist (suffix match) → `422 SSRF_BLOCKED` (`details.reason`: scheme, userinfo, host, port, private_ip) or
        `403 FORBIDDEN` (`reason`: denylist, allowlist, disabled). DNS is resolved inside the task: any private/special address
        among the answers fails the task with `SSRF_BLOCKED`; redirects (max 5) are re-validated per hop. 1..10 URLs per request;
        10 tasks per hour per user → `429 RATE_LIMITED` + `Retry-After`. `filename` applies to a single URL (`filenames` maps
        url → name for several); otherwise the name comes from `Content-Disposition`, then the last URL segment, then
        `download-<unix>`. Size limit = min(`REMOTE_DOWNLOAD_MAX_SIZE`, `MAX_UPLOAD_SIZE`) → `FILE_TOO_LARGE`; quota/disk →
        `QUOTA_EXCEEDED`. Audit `remote_download.created` records hosts only; logs never contain query strings.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteDownloadRequest" }
      responses:
        "202":
          description: Tasks queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteDownloadResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/remote-downloads/probe:
    post:
      tags: [remote]
      summary: Inspect a URL before downloading (HEAD, then GET Range 0-0)
      operationId: remoteDownloadsProbe
      description: Same URL/SSRF rules as the create call; answers the final URL (no query string), size when known, suggested file name, Range support and content type.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteProbeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/upload/precheck:
    post:
      tags: [upload]
      summary: Validate planned uploads before the tus session starts (SPEC §8.8 step 2)
      operationId: uploadPrecheck
      description: |
        Per file: `ok`, `conflict` (with the existing item's `size`/`mtime`/`isDir`; `reason: type_mismatch` when a folder is in the way),
        `blocked_ext` (`BLOCKED_EXTENSIONS`), `too_large` (`MAX_UPLOAD_SIZE`) or `name_invalid` (`reason` from `fsjail.ValidateName`).
        `relativePath` is the folder path below `path` for folder uploads ("a/b/c", no file name). `needed` sums the `ok` + `conflict`
        files; `quotaOk` is false when `needed > free` (`quotaReason: quota`) or when the storage disk would drop below its reserve
        (`quotaReason: disk`). `free` already subtracts the reservations of active uploads. Nothing is reserved by this call.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadPrecheckRequest" }
      responses:
        "200":
          description: Verdict per file plus the quota summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPrecheckResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/upload/tus:
    post:
      tags: [upload]
      summary: Create a resumable upload (tus 1.0.0 creation extension)
      operationId: tusCreate
      description: |
        The tus endpoint is `/api/v1/upload/tus/` (trailing slash; both spellings are accepted). Protocol headers: `Tus-Resumable: 1.0.0`,
        `Upload-Length` (bytes; `Upload-Defer-Length` is rejected), `Upload-Metadata` (base64 pairs): `filename` (required), `path` (destination
        folder, required), `relativePath` (folder path below `path` for folder uploads), `onConflict` (`overwrite|skip|rename`, default `rename`),
        `lastModified` (epoch ms → mtime of the final file). Aliases `name`, `dest`, `relPath`, `policy` are accepted.
        Session cookie and `X-CSRF-Token` are required on POST/PATCH/DELETE; `HEAD`/`OPTIONS` need the cookie only.
        Creating reserves `Upload-Length` bytes against the quota (durable: the sum of active sessions survives restarts) and answers
        `201` with an absolute `Location` built from `APP_BASE_URL`. Rejections use the JSON error envelope: `400 NAME_INVALID|PATH_INVALID|VALIDATION_FAILED`,
        `404 NOT_FOUND` (destination folder), `413 PAYLOAD_TOO_LARGE` (above `MAX_UPLOAD_SIZE`) / `413 QUOTA_EXCEEDED`, `415 UNSUPPORTED_TYPE`.
        An empty file (`Upload-Length: 0`) is finalised inside the POST (see the PATCH response headers).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - { name: Upload-Length, in: header, required: true, schema: { type: integer, minimum: 0 } }
        - { name: Upload-Metadata, in: header, required: true, schema: { type: string } }
      responses:
        "201":
          description: Upload created
          headers:
            Location: { schema: { type: string }, description: "Absolute upload URL (APP_BASE_URL + /api/v1/upload/tus/ + id)" }
            Upload-Warnings: { schema: { type: string }, description: "Comma-separated name warnings (e.g. windows_incompatible)" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    options:
      tags: [upload]
      summary: tus capability discovery (`Tus-Version`, `Tus-Extension`, `Tus-Max-Size`)
      operationId: tusOptions
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Protocol headers }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/upload/tus/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Upload id (UUIDv7) from Location" }
    head:
      tags: [upload]
      summary: Current offset of an upload (resume)
      operationId: tusHead
      description: |
        Only the owner of an **active** session sees it; any other id answers `404 NOT_FOUND` (finished, aborted, expired or foreign uploads).
        If every byte is already stored but the finalisation of the last PATCH failed with a retryable error (e.g. `423`), HEAD (and an empty
        PATCH at the final offset) finalises the upload and answers like the last PATCH would (`Upload-Result`/`Upload-Path` headers, review C).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
      responses:
        "200":
          description: Offset known
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [upload]
      summary: Append one chunk (`application/offset+octet-stream`, at most `UPLOAD_CHUNK_SIZE` bytes)
      operationId: tusPatch
      description: |
        `Upload-Offset` must equal the server offset (`409` otherwise). A body larger than `UPLOAD_CHUNK_SIZE` is refused with
        `413 PAYLOAD_TOO_LARGE` (`reason: chunk_too_large`) before it is read. The PATCH that completes the upload also finalises it:
        the stored size is verified, the file is moved atomically into `path/relativePath/filename` (folders created as needed) under
        `onConflict`, quota is committed, `activity_logs` gets `upload`, listings/thumbnails are invalidated and `file.changed` is sent.
        Finalisation answers with `Upload-Result: created|renamed|overwritten|skipped` and `Upload-Path` (percent-encoded virtual path,
        Upload-Version: { schema: { type: string }, description: "Id of the pre-image version an overwrite of a text file took (Step 16b)" }
        empty when skipped). If the destination folder disappeared the upload is dropped (`404 NOT_FOUND`); a folder in the way of an
        `overwrite` is `400 VALIDATION_FAILED type_mismatch` (upload dropped); a path lock answers `423 OPERATION_IN_PROGRESS` so tus
        clients retry. Excluded from the API timeout and the JSON body limit.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Chunk stored (and, on the last one, the file finalised)
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Result: { schema: { type: string, enum: [created, renamed, overwritten, skipped] } }
            Upload-Path: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Mismatched offset (tus `ERR_MISMATCHED_OFFSET`) }
        "413": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
    delete:
      tags: [upload]
      summary: Abort an upload (tus termination extension); its quota reservation is released
      operationId: tusDelete
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
      responses:
        "204": { description: Upload removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    options:
      tags: [upload]
      summary: tus capability discovery
      operationId: tusOptionsID
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Protocol headers }
  /api/v1/search/names:
    get:
      tags: [search]
      summary: Name search below a folder (SPEC §8.12 "Pencarian nama")
      operationId: searchNames
      description: |
        Walks `path` (default `/`, `recursive` default true) without following symlinked folders and matches the entry name:
        case-insensitive substring (Unicode fold) by default, `*`/`?` wildcards (`glob=1` or when the query contains them) or
        RE2 (`regex=1`). Filters: `types` (categories of `files/list`), `ext` (comma list), `minSize`/`maxSize` (bytes, files only),
        `from`/`to` (mtime, RFC 3339 or YYYY-MM-DD), `tag` (colour). Either `q` or one filter is required. The result set is
        capped at 5 000 entries / 20 s (`truncated:true`), sorted naturally, cached 60 s and paged with `cursor`
        (`limit` default 500, max 1 000). A fresh search counts against 30/minute per user (`429 RATE_LIMITED`, `Retry-After`)
        and is written to the history. `path` outside the root → `400 PATH_INVALID`; `.system` and atomic-write staging files never appear.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 512 } }
        - { name: path, in: query, schema: { type: string, default: "/" } }
        - { name: recursive, in: query, schema: { type: boolean, default: true } }
        - { name: glob, in: query, schema: { type: boolean } }
        - { name: regex, in: query, schema: { type: boolean } }
        - { name: types, in: query, schema: { type: string }, description: "Comma-separated categories" }
        - { name: ext, in: query, schema: { type: string }, description: "Comma-separated extensions" }
        - { name: minSize, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxSize, in: query, schema: { type: integer, minimum: 0 } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: One page of results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchNamesResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/search/content:
    post:
      tags: [search]
      summary: Content search streamed as NDJSON (SPEC §8.12 "Pencarian isi", ADR-12)
      operationId: searchContent
      description: |
        Engine `rg --json --no-ignore --hidden --no-follow -n --column -C 1 --max-filesize <EDITOR_MAX_FILE_SIZE> --max-count 200`
        with cwd = the folder (read lock held), timeout 30 s, or the Go fallback (2 workers, RE2, NUL = binary, 1 MB line buffer)
        when `RG_PATH` is empty/missing; both produce the same rows. The pattern is validated as RE2 first (`400 VALIDATION_FAILED
        fields.q=invalid_regex`), so catastrophic patterns are impossible. Response `application/x-ndjson`: one `SearchMatch` per
        line, then a final `SearchSummary` (`done:true`). The stream stops at `maxMatches` (default/max 2 000, `truncated:true`)
        or when the client disconnects; a new search of the same user cancels the previous one. Rate limit 10/minute per user.
        `minSize`/`from`/`to` are applied after matching (ripgrep has no such filters).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentSearchRequest" }
      responses:
        "200":
          description: NDJSON stream
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SearchMatch" }
                  - { $ref: "#/components/schemas/SearchSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/search/replace/preview:
    post:
      tags: [search]
      summary: Queue a replace_preview task (SPEC §8.12 "Replace in files")
      operationId: searchReplacePreview
      description: |
        Runs the content search, then computes the replacement per matching line in memory (regex → `ReplaceAllString` with
        `$1` groups; plain → literal) and stores the hunks under `DATA_DIR/tmp/sr-<task>/preview.json` for 10 minutes.
        Task result: `ReplacePreviewResult` — the first 20 files carry up to 50 hunks each, the rest only counts. Files that
        are binary, not UTF-8 (decoder arrives with Step 16a), too large or unreadable are listed with `skipped`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacePreviewRequest" }
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/search/replace:
    post:
      tags: [search]
      summary: Queue a replace_apply task for a stored preview
      operationId: searchReplaceApply
      description: |
        For every selected file (default: all previewed files): write lock, re-read, sha256 compared with the preview (changed →
        skipped `changed`), pre-image version `replace_in_files` (when `FILE_VERSION_LIMIT` > 0), atomic write (tmp + rename,
        mode and per-line EOL kept), quota delta, activity `replace`, one log line per file. Result `ReplaceApplyResult` with the
        version ids for rollback (`POST /versions/{id}/restore`). The preview is deleted afterwards.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceApplyRequest" }
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { description: "NOT_FOUND — preview expired or unknown (`details.reason: preview_expired`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/search/history:
    get:
      tags: [search]
      summary: The user's last 50 queries (newest first)
      operationId: searchHistory
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [name, content] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SearchHistoryEntry" } }
                  limit: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [search]
      summary: Clear the user's search history
      operationId: searchHistoryClear
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Cleared }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/versions:
    get:
      tags: [versions]
      summary: Versions of a file, newest first (SPEC §6.3 "Versions")
      operationId: versionsList
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, enabled]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileVersion" } }
                  limit: { type: integer, description: "FILE_VERSION_LIMIT" }
                  enabled: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [versions]
      summary: Delete every version of a file (rows + blobs; bytes return to the quota)
      operationId: versionsDeleteAll
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted (also when there was nothing) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/files/versions:
    get:
      tags: [versions]
      summary: Alias of GET /versions (PROMPT Step 16b naming)
      operationId: filesVersionsList
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, enabled]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileVersion" } }
                  limit: { type: integer }
                  enabled: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/content:
    get:
      tags: [versions]
      summary: Decoded content of a version (read-only, same shape as /files/content)
      operationId: versionContent
      description: |
        The blob is decoded like the live file (BOM/chardet or `encoding` override, EOL, language from the path). `readOnly`
        is always true and `etag` is `"v-<id>"`. Blobs above `EDITOR_MAX_FILE_SIZE` answer `413 FILE_TOO_LARGE` (use download);
        binary blobs `415 BINARY_FILE`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: encoding, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/download:
    get:
      tags: [versions]
      summary: Download the raw blob of a version as `<name>.v<no>.<ext>`
      operationId: versionDownload
      description: |
        Session-bound attachment stream (Range, ETag) with the §8.9 attachment policy; no signed URL is involved because the
        route is owner-only (SPEC §6.3 lists it as a signed redirect — deviation recorded in PROGRESS, Step 16b).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Attachment stream }
        "206": { description: Partial content }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/restore:
    post:
      tags: [versions]
      summary: Write a version back to its path
      operationId: versionRestore
      description: |
        Takes a pre-image of the current content first (reason `restore`, skipped when identical), then writes the blob
        atomically with the mode of the existing file (0640 when the file was gone). `423 OPERATION_IN_PROGRESS` while another
        operation holds the path; `403 FORBIDDEN reason=versions_disabled` when `FILE_VERSION_LIMIT=0`.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Restored
          headers:
            ETag: { schema: { type: string }, description: "New etag of the file (Step 16b)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionRestoreResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}:
    delete:
      tags: [versions]
      summary: Delete one version (row + blob; bytes return to the quota)
      operationId: versionDelete
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/shares:
