openapi: 3.1.0
info:
  title: FileManager API
  version: 0.1.0
  description: |
    REST API aplikasi File Manager multi-user `file.kppbwi.app` (SPEC §6).
    Kerangka ini dibuat di Step 1 dan diperluas setiap step. Base path API: `/api/v1`.
    Semua error memakai envelope `{"error":{"code","message","details"}}`.
servers:
  - url: https://file.kppbwi.app
    description: Produksi (di belakang Nginx aaPanel)
  - url: http://127.0.0.1:8080
    description: Lokal (binary langsung)

tags:
  - name: system
    description: Kesehatan proses dan informasi build

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness
      description: Selalu 200 selama proses hidup. Boleh dipublikasikan lewat Nginx (rate limit 60/menit per IP).
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
  /readyz:
    get:
      tags: [system]
      summary: Readiness
      description: Memeriksa DATA_DIR writable, STORAGE_ROOT readable (DB ditambah Step 2). Hanya loopback (tidak di-proxy Nginx).
      operationId: readyz
      responses:
        "200":
          description: Siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/version:
    get:
      tags: [system]
      summary: Versi aplikasi dan nama aplikasi
      operationId: version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, appName]
                properties:
                  version:
                    type: string
                  appName:
                    type: string

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fm_session
      description: Sesi server-side (SPEC §8.1). Semua request non-GET juga butuh header `X-CSRF-Token`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kode error SPEC §6.2
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - PASSWORD_CHANGE_REQUIRED
                - CSRF_INVALID
                - VALIDATION_FAILED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - ALREADY_EXISTS
                - CONFLICT
                - QUOTA_EXCEEDED
                - RATE_LIMITED
                - ACCOUNT_LOCKED
                - ACCOUNT_DISABLED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_TYPE
                - PATH_INVALID
                - NAME_INVALID
                - SYMLINK_ESCAPE
                - OPERATION_IN_PROGRESS
                - TASK_LIMIT
                - ARCHIVE_UNSAFE
                - ARCHIVE_PASSWORD_REQUIRED
                - ARCHIVE_PASSWORD_WRONG
                - ARCHIVE_LIMIT
                - SSRF_BLOCKED
                - SHARE_EXPIRED
                - SHARE_DISABLED
                - SHARE_PASSWORD_REQUIRED
                - SHARE_PASSWORD_WRONG
                - SHARE_LIMIT_REACHED
                - SIGNATURE_INVALID
                - SIGNATURE_EXPIRED
                - DEPENDENCY_MISSING
                - FILE_TOO_LARGE
                - BINARY_FILE
                - INTERNAL
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                requestId:
                  type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
              error:
                type: string
        failed:
          type: array
          items:
            type: string
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
