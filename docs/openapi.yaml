              bytes: { type: integer, format: int64 }
              files: { type: integer, format: int64 }
        trash: { type: integer, format: int64 }
        versions: { type: integer, format: int64 }
        quota:
          type: object
          properties:
            limit: { type: integer, format: int64 }
            used: { type: integer, format: int64 }
            free: { type: integer, format: int64 }
            percent: { type: number }
            dirty: { type: boolean }
        cached: { type: boolean }
        durationMs: { type: integer, format: int64 }
