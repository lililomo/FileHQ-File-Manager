# =============================================================================
# FileManager — Nginx snippets for the OPTIONAL second aaPanel site
# usercontent.file.kppbwi.app (Step 23e, SPEC ADR-06 alternative (a), §10.3,
# docs/DEPLOY-AAPANEL.md §13). Nothing here is needed while CONTENT_BASE_URL
# is empty; the live site keeps working without this file.
#
# Same conventions as deploy/nginx-aapanel.conf: a Reverse Proxy project
# (aaPanel 8.0.7) that forwards to the SAME binary on 127.0.0.1:8080. The
# application tells the two hosts apart by the Host header: on this host it
# serves only the signed content routes, ignores every cookie and answers
# CORS for https://file.kppbwi.app; everything else is 404. The rules below
# repeat that allowlist in Nginx (defence in depth — a bug in the app's host
# filter still cannot expose the SPA or the JSON API on this host).
#
#   * PART A → proxy URL "/" → custom configuration (inside location ^~ /)
#   * PART B → site "server block" (inside server { })
#   Timeouts (connect 10 / send 3600 / read 3600 s) are set in the proxy URL
#   fields, as for the main site. Cache OFF.
#
# Why server-level "if" again: aaPanel's "location ^~ /" wins over any regex
# location, so the allowlist is an "if ($uri !~ …) { return 404; }" that
# Nginx evaluates before choosing a location (see nginx-aapanel.conf §4.C).
# $uri is decoded and normalised; the query string is not part of $uri.
# =============================================================================


# --- BEGIN PART A (inside location ^~ / — proxy URL "/" → custom configuration) ---
# aaPanel already sends Host $http_host, X-Real-IP, X-Forwarded-For.
proxy_set_header X-Forwarded-Proto $scheme;   # app: HSTS + "is this the https content host"
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;
# Only GET/HEAD/OPTIONS without bodies reach this host.
client_max_body_size    1m;
# Large downloads / media streaming: no buffering, no temp files, no cache
# copies of user files in /www/server/nginx/proxy_cache_dir.
proxy_buffering          off;
proxy_max_temp_file_size 0;
proxy_cache              off;
# Every URL on this host carries a bearer signature (sig=…, TTL 5 min–2 h).
# Keep it out of the Nginx access log (the app logs path + status itself).
# A location-level access_log replaces the inherited ones (perlu verifikasi:
# the aaPanel statistics page then stays empty for this site).
access_log off;
# --- END PART A ---


# --- BEGIN PART B (server block — "Config file" → server block / site config) ---
# 0. Cloudflare in front (the record is proxied like the main site): take the
#    visitor address only from Cloudflare's ranges. Same list as
#    nginx-aapanel.conf (copied 2026-10-28); refresh both together.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 1. Allowlist (mirror of internal/httpapi/content_origin.go contentRoutes):
#    only the signed content routes are proxied; the ACME path stays for
#    Let's Encrypt (served from the document root by aaPanel's well-known
#    include, which runs before the proxy block). Everything else — the SPA,
#    /s/<token>, the JSON API, /healthz, /readyz, /metrics, dotfiles — is a
#    404 from Nginx, so it never reaches the app on this host.
if ($uri !~ "^/(\.well-known/|api/v1/(files/(raw|download|zip|thumb|hls/[^/]+/[^/]+)|archives/entry-content|public/shares/[^/]+/(raw|thumb|download|zip))$)") { return 404; }
# 2. Only GET, HEAD and the CORS preflight (OPTIONS) exist here.
if ($request_method !~ "^(GET|HEAD|OPTIONS)$") { return 404; }
# --- END PART B ---
