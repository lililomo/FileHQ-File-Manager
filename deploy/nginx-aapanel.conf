# =============================================================================
# FileManager — Nginx snippets for the aaPanel site file.kppbwi.app (SPEC §12.4)
# Pasted through the aaPanel UI only; never edit
# /www/server/panel/vhost/nginx/file.kppbwi.app.conf by hand (aaPanel rewrites
# it). Step-by-step: docs/DEPLOY-AAPANEL.md.
#
# Variant A — aaPanel 8.0.7 "Reverse Proxy" project (verified on this server
# by reading /www/server/panel/mod/project/proxy/comMod.py): the vhost is
# regenerated from /www/server/proxy_project/sites/<domain>/<domain>.json and
# only two custom fields survive that:
#   * per proxy URL "/": custom_conf — rendered INSIDE  location ^~ / { ... }
#     after aaPanel's own proxy_pass/proxy_set_header/timeouts       → PART A
#   * site "server block" (server_block) — rendered inside server { }
#     between #SERVER-BLOCK START/END, after the proxy location      → PART B
#   Timeouts are separate fields of the proxy URL (connect/send/read); set them
#   there (10 / 3600 / 3600 s) — the same directive in PART A would be a
#   duplicate and fail nginx -t.
# Variant B — PHP site "Static" + site Reverse proxy (text of the brief): PART A
#   goes into the proxy's own config editor, PART B into the site config file
#   (perlu verifikasi: exact menu names and whether aaPanel keeps the lines
#   after later SSL/proxy changes — re-check with  nginx -T  afterwards).
#
# Why no regex "location ~" for the deny rules: aaPanel's proxy block is
# "location ^~ /", and a matching ^~ prefix stops nginx from evaluating regex
# locations at all — aaPanel's own "location ~ ^/(\.user.ini|\.env|...)" never
# runs for proxied sites. Server-level "if (...) { return 404; }" is evaluated
# before location selection, so PART B uses that.
# =============================================================================


# --- BEGIN PART A (inside location ^~ / — proxy URL "/" → custom configuration) ---
# aaPanel already sends Host $http_host, X-Real-IP, X-Forwarded-For (keep
# "send domain" = $http_host) and, with WebSocket on, HTTP/1.1 + Upgrade.
proxy_set_header X-Forwarded-Proto $scheme;   # app: HSTS, Secure cookies, tus Location (TRUSTED_PROXIES=127.0.0.1)
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;   # same id in the Nginx and app logs
# tus upload: stream the body straight to the app, no temp file in Nginx
proxy_request_buffering off;
client_max_body_size    64m;      # >= UPLOAD_CHUNK_SIZE (16 MB) + overhead; raise with the chunk size
client_body_timeout     300s;
# SSE (/api/v1/events) and large downloads: no buffering, no temp files
proxy_buffering          off;
proxy_max_temp_file_size 0;
# aaPanel's http-level proxy.conf sets "proxy_cache cache_one" for every site:
# never keep copies of user files in /www/server/nginx/proxy_cache_dir
# (readable by the www user). Keep "Cache" OFF for this proxy in the UI.
proxy_cache              off;
# No add_header here: it would hide aaPanel's server-level HSTS header; the app
# sends its own security headers (CSP, HSTS, nosniff, ...).
# Optional: log this site to a plain file only. aaPanel's site statistics
# (extension/<domain>/site_total.conf, log_format site_total) also record the
# Cookie header; a location-level access_log replaces all inherited ones
# (perlu verifikasi: the statistics page then stays empty for this site).
#access_log /www/wwwlogs/file.kppbwi.app.log;
# --- END PART A ---


# --- BEGIN PART B (server block — "Config file" → server block / site config) ---
# 1. Loopback-only endpoints (systemd/update.sh use 127.0.0.1:8080 directly).
location = /readyz  { return 404; }
location = /metrics { return 404; }

# 2. Never serve source, binary, docs or dotfiles, even if the document root
#    were exposed (defense in depth; the app 404s dotfiles itself). $uri is
#    already decoded and normalised. ".well-known" stays reachable for
#    Let's Encrypt (aaPanel's include well-known/<domain>.conf runs earlier).
if ($uri ~* "^/(bin|backend|web|deploy|docs|migrations|proxy_cache_dir)(/|$)") { return 404; }
if ($uri ~* "^/(Makefile|NOTICE|README\.md|PRD\.md|SPEC\.md|PROMPT\.md|PROGRESS\.md|promp-master\.md|go\.mod|go\.sum)$") { return 404; }
if ($uri ~ "/\.(?!well-known(/|$))") { return 404; }

# 3. Public share links carry their token in the path (/s/<token>,
#    /api/v1/public/shares/<token>/...): keep them out of the Nginx access
#    and statistics logs (review E m-14). Same proxy settings as "/".
location ^~ /s/ {
    access_log off;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_request_buffering off;
    proxy_buffering          off;
    proxy_max_temp_file_size 0;
    proxy_cache              off;
    client_max_body_size     64m;
    client_body_timeout      300s;
    proxy_connect_timeout    10s;
    proxy_send_timeout       3600s;
    proxy_read_timeout       3600s;
}
location ^~ /api/v1/public/ {
    access_log off;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_request_buffering off;
    proxy_buffering          off;
    proxy_max_temp_file_size 0;
    proxy_cache              off;
    client_max_body_size     64m;
    client_body_timeout      300s;
    proxy_connect_timeout    10s;
    proxy_send_timeout       3600s;
    proxy_read_timeout       3600s;
}
# --- END PART B ---


# --- PART C (optional, http block — "Config file" → http block) ---
# Extra per-IP brake in front of the app's own limiter (RATE_LIMIT_LOGIN_IP):
#   limit_req_zone $binary_remote_addr zone=fm_login:10m rate=30r/m;
# and in PART B a copy of the "/s/" block for  location = /api/v1/auth/login
# with  limit_req zone=fm_login burst=10 nodelay;  (without access_log off).
# Not needed for v1; the application limiter already answers 429.
