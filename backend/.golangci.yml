version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - forbidigo
    - ineffassign
    - unused
    - errorlint
    - bodyclose
    - noctx
    - unconvert
    - misspell
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # All filesystem access must go through internal/fsjail (SPEC §5).
        # Allowed packages are listed under exclusions.rules: fsjail itself,
        # config (operator directories), db (SQLite file), thumbs and upload
        # (caches/chunks in DATA_DIR) and cmd.
        - pattern: ^os\.(Open|OpenFile|OpenRoot|Create|CreateTemp|ReadFile|WriteFile|Remove|RemoveAll|Rename|Mkdir|MkdirAll|MkdirTemp|Symlink|Link|Readlink|Chmod|Chown|Chtimes|Truncate|ReadDir|DirFS|Stat|Lstat)$
          msg: use internal/fsjail for filesystem access
        - pattern: ^filepath\.(Walk|WalkDir|EvalSymlinks)$
          msg: use internal/fsjail (Jail.WalkDir) for filesystem traversal
        - pattern: ^exec\.Command(Context)?$
          msg: use internal/exec (argv runner, no shell)
    gosec:
      excludes:
        - G104 # handled by errcheck
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
  exclusions:
    rules:
      - path: internal/fsjail/
        linters: [forbidigo]
      - path: internal/config/
        linters: [forbidigo]
      - path: internal/db/
        linters: [forbidigo]
      - path: internal/thumbs/
        linters: [forbidigo]
      - path: internal/upload/
        linters: [forbidigo]
      - path: internal/exec/   # only the exec.Command rule is meant for it; os.* stays forbidden there by review
        linters: [forbidigo]
      - path: cmd/
        linters: [forbidigo]
      - path: _test\.go
        linters: [forbidigo, gosec, noctx, errcheck]
      - path: internal/webassets/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - kppbwi.app/filemanager
