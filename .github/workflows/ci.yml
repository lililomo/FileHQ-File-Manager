# CI for FileManager. Git hosting is not decided yet (repo is local on the
# server); this workflow targets GitHub Actions and is written so it can be
# ported to GitLab CI / Gitea Actions with minimal changes.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test
        run: go test ./... -race -cover
      - name: sqlc (generated code must be committed and current)
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: sqlc generate && git diff --exit-code -- internal/db/sqlc
      - name: Sort policy (no collate.Numeric, SPEC §8.3)
        run: |
          if grep -rn --include='*.go' 'collate\.Numeric' .; then echo 'collate.Numeric is forbidden'; exit 1; fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
          version: latest
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Prettier
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build (fails when the initial JS is >= 300 KB gzip, SPEC 1.6)
        run: pnpm build --report
      - name: Bundle budget gate fails when exceeded (self-test)
        run: |
          if BUNDLE_BUDGET_KB=100 node scripts/bundle-size.mjs > /dev/null 2>&1; then
            echo "bundle-size.mjs did not fail with a 100 KB budget"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: web/bundle-report
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - name: Build binary with embedded frontend
        run: make build GOMAXPROCS=2
      - name: Install Chromium (headless shell)
        run: pnpm -C web exec playwright install --with-deps --only-shell chromium
      - name: Playwright E2E against the real binary
        run: pnpm -C web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  perf:
    # Step 21 harness (docs/PERF.md): real binary, 10k listing cold/warm,
    # thumbnails, 1 GiB upload/zip/extract RSS. Shared runners are noisy, so
    # the result is informational here; the gate is `make perf` on the server.
    runs-on: ubuntu-latest
    needs: [backend, web]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libvips-tools ffmpeg poppler-utils
      - name: make build + make perf
        run: make build GOMAXPROCS=2 && make perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: .perfdata/*.json
          retention-days: 30

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - name: Dependency audit (fails on reachable Go vulnerabilities and high/critical npm advisories)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make audit

  fuzz:
    # Informational: 30 s per target. A crash here is reported but does not
    # block the merge (corpus regressions run as ordinary tests in 'backend').
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - run: make fuzz FUZZTIME=30s

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  build:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - name: make build
        run: make build GOMAXPROCS=2
      - name: Smoke
        run: |
          ./bin/filemanager version
          ./bin/filemanager check-deps
      - uses: actions/upload-artifact@v4
        with:
          name: filemanager-linux-amd64
          path: bin/filemanager
          retention-days: 14
      - name: Release tarball for deploy/update.sh --release
        run: |
          tar -czf filemanager-linux-amd64.tar.gz bin/filemanager deploy docs/DEPLOY-AAPANEL.md
          sha256sum filemanager-linux-amd64.tar.gz > filemanager-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: filemanager-release
          path: filemanager-linux-amd64.tar.gz*
          retention-days: 14

  deploy-scripts:
    # Step 22: shellcheck, install.sh twice in scratch dirs (idempotent,
    # dry-run inert), update.sh rollback with a binary that never gets ready
    # (<= 60 s), and deploy/nginx-aapanel.conf inside a copy of the aaPanel
    # Reverse Proxy server block (throw-away Nginx on loopback).
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y shellcheck nginx-light ffmpeg libvips-tools poppler-utils ripgrep 7zip
      - run: make build GOMAXPROCS=2
      - name: make test-deploy
        run: FM_NGINX=/usr/sbin/nginx make test-deploy

  install-smoke:
    # Real systemd on the runner VM (a container has no init): install.sh
    # --skip-aapanel --no-swap twice as root with the CI binary, then the
    # service must answer /healthz as user filemanager on loopback only.
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: filemanager-linux-amd64
          path: ${{ runner.temp }}/dist
      - name: Copy the checkout to the production path
        run: |
          chmod 0755 "$RUNNER_TEMP/dist/filemanager"
          sudo mkdir -p /www/wwwroot
          sudo cp -a "$GITHUB_WORKSPACE" /www/wwwroot/file.kppbwi.app
      - name: install.sh (first run)
        run: sudo bash /www/wwwroot/file.kppbwi.app/deploy/install.sh --yes --skip-aapanel --no-swap --binary "$RUNNER_TEMP/dist/filemanager"
      - name: install.sh (second run, must be a no-op)
        run: sudo bash /www/wwwroot/file.kppbwi.app/deploy/install.sh --yes --skip-aapanel --no-swap --binary "$RUNNER_TEMP/dist/filemanager" | tee second.log && grep -q 'nothing changed' second.log
      - name: Smoke
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8080/readyz
          systemctl is-active filemanager
          test "$(ps -o user= -p "$(systemctl show -p MainPID --value filemanager)")" = filemanager
          sudo ss -ltnp | grep ':8080 ' | grep -q '127.0.0.1:8080'
          test "$(sudo stat -c '%U:%G %a' /www/storage/FileManager)" = "filemanager:filemanager 750"
          test "$(sudo stat -c '%U %a' /www/wwwroot/file.kppbwi.app/.env)" = "filemanager 600"
          /www/wwwroot/file.kppbwi.app/bin/filemanager version
          sudo systemd-analyze security filemanager | tail -1
      - name: Thumbnail tools run under the unit's sandbox
        run: |
          sudo systemd-run --wait --collect --pipe -p User=filemanager -p ProtectSystem=strict -p PrivateDevices=true \
            -p SystemCallFilter=@system-service -p SystemCallFilter=~@privileged -p SystemCallErrorNumber=EPERM \
            -p NoNewPrivileges=true -p ProtectProc=invisible \
            /usr/bin/nice -n 10 /usr/bin/ionice -c 3 /usr/bin/ffmpeg -hide_banner -f lavfi -i testsrc=size=64x64:rate=1 -frames:v 1 -f null -
      - name: update.sh with the same binary (backup + restart path)
        run: sudo bash /www/wwwroot/file.kppbwi.app/deploy/update.sh --yes --binary "$RUNNER_TEMP/dist/filemanager"
      - if: failure()
        run: sudo journalctl -u filemanager -n 200 --no-pager

  docker:
    # Optional image (ADR-20): must build and answer /healthz.
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f deploy/Dockerfile -t filemanager:ci --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA::7} .
      - name: Smoke
        run: |
          docker run -d --name fm -p 127.0.0.1:8080:8080 \
            -e APP_BASE_URL=https://file.example.test -e APP_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_INITIAL_PASSWORD="$(openssl rand -hex 12)" filemanager:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/readyz
          docker exec fm /app/bin/filemanager check-deps
      - if: always()
        run: docker logs fm || true
