# CI for FileManager. Git hosting is not decided yet (repo is local on the
# server); this workflow targets GitHub Actions and is written so it can be
# ported to GitLab CI / Gitea Actions with minimal changes.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test
        run: go test ./... -race -cover
      - name: sqlc (generated code must be committed and current)
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: sqlc generate && git diff --exit-code -- internal/db/sqlc
      - name: Sort policy (no collate.Numeric, SPEC §8.3)
        run: |
          if grep -rn --include='*.go' 'collate\.Numeric' .; then echo 'collate.Numeric is forbidden'; exit 1; fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
          version: latest
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Prettier
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build (fails when the initial JS is >= 300 KB gzip, SPEC 1.6)
        run: pnpm build --report
      - name: Bundle budget gate fails when exceeded (self-test)
        run: |
          if BUNDLE_BUDGET_KB=100 node scripts/bundle-size.mjs > /dev/null 2>&1; then
            echo "bundle-size.mjs did not fail with a 100 KB budget"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: web/bundle-report
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - name: Build binary with embedded frontend
        run: make build GOMAXPROCS=2
      - name: Install Chromium (headless shell)
        run: pnpm -C web exec playwright install --with-deps --only-shell chromium
      - name: Playwright E2E against the real binary
        run: pnpm -C web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  perf:
    # Step 21 harness (docs/PERF.md): real binary, 10k listing cold/warm,
    # thumbnails, 1 GiB upload/zip/extract RSS. Shared runners are noisy, so
    # the result is informational here; the gate is `make perf` on the server.
    runs-on: ubuntu-latest
    needs: [backend, web]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libvips-tools ffmpeg poppler-utils
      - name: make build + make perf
        run: make build GOMAXPROCS=2 && make perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: .perfdata/*.json
          retention-days: 30

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - name: Dependency audit (fails on reachable Go vulnerabilities and high/critical npm advisories)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make audit

  fuzz:
    # Informational: 30 s per target. A crash here is reported but does not
    # block the merge (corpus regressions run as ordinary tests in 'backend').
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - run: make fuzz FUZZTIME=30s

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  build:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - name: make build
        run: make build GOMAXPROCS=2
      - name: Smoke
        run: |
          ./bin/filemanager version
          ./bin/filemanager check-deps
      - uses: actions/upload-artifact@v4
        with:
          name: filemanager-linux-amd64
          path: bin/filemanager
          retention-days: 14
